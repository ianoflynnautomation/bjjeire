feature: stores
openapi:
  served: /v3/api-docs
  artifact: ghcr.io/<owner>/bjjeire-openapi-contract
  routes:
    - method: GET
      path: /api/v1/store
      auth: public
      response: PagedResponse<StoreDto>
pagination:
  page: 1-based
  pageSize: max 100
filters:
  name_search: client-side only
sort: name ascending
invariants:
  - listing_excludes: isActive != true
  - no_county_or_location: do not invent them
  - feature_flag: Stores fail-closed
  - cache_tag: STORES_TAG
  - writes: not mapped on StoreController (living spec FR-003 is ahead of the API)
pointers:
  database: specs/database-contracts/store.md
  feature_spec: specs/features/stores.md
  pact: src/bjjeire-app/src/contracts/pact/store.pact.test.ts
  generated_types: src/bjjeire-app/src/types/generated/api.ts
  ui_strings: src/bjjeire-app/src/config/ui-content.ts
  test_ids: src/bjjeire-app/src/constants/storeDataTestIds.ts
  api_routes_spa: src/bjjeire-app/src/config/api-routes.ts
