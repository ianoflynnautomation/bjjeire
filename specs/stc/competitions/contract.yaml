feature: competitions
openapi:
  served: /v3/api-docs
  artifact: ghcr.io/<owner>/bjjeire-openapi-contract
  routes:
    - method: GET
      path: /api/v1/competition
      auth: public
      response: PagedResponse<CompetitionDto>
pagination:
  page: 1-based
  pageSize: max 100
filters:
  includeInactive: boolean, default false
  name_search: client-side only
sort: startDate ascending, then name
invariants:
  - listing_excludes: inactive and endDate < now unless includeInactive
  - feature_flag: Competitions fail-closed
  - cache_tag: COMPETITIONS_TAG
  - writes: not mapped on CompetitionController (living spec FR-004 is ahead of the API)
pointers:
  database: specs/database-contracts/competition.md
  feature_spec: specs/features/competitions.md
  pact: src/bjjeire-app/src/contracts/pact/competition.pact.test.ts
  msw: src/bjjeire-app/src/testing/msw/handlers/competitions.ts
  generated_types: src/bjjeire-app/src/types/generated/api.ts
  ui_strings: src/bjjeire-app/src/config/ui-content.ts
  test_ids: src/bjjeire-app/src/constants/competitionDataTestIds.ts
  api_routes_spa: src/bjjeire-app/src/config/api-routes.ts

# ---- BJJ Éire competitions (ADR-0015; renames in specs/002-merge-tournaments-competitions/contracts/rename.yaml) ----
# The retired prefix, SPA addresses and collections answer as unknown ones; nothing redirects ("#3016").
bjjeire_competitions:
  # Routes, auth and invariants for BJJ Éire competitions. Copied from the design record
  # (specs/001-tournament-registration/contracts/contract.yaml) and kept here from now on.
  # status: every route below is live (slices 1 to 5).
  feature_flag: BjjEireCompetitions   # default off; API answers 404 and SPA hides routes when off
  openapi:
    served: /v3/api-docs
    artifact: ghcr.io/<owner>/bjjeire-openapi-contract

  auth:
    public: no token
    admin: workforce-tenant token with scope access_as_writer (unchanged)
    competitor: external-tenant token with scope access_as_competitor; identity = (iss, sub)
    stripe: Stripe-Signature header verified against the webhook secret

  errors: ProblemDetail (urn:bjjeire), via web.ApiExceptionHandler
    # 400 validation · 401 no token, invalid token or wrong audience · 403 wrong kind of account or not the owner
    # 404 unknown id, draft competition seen by non-admin, or flag off
    # 409 business conflict; `type` distinguishes the cases listed per route

  routes:
    # ---- Competition: public reads -------------------------------------------
    - method: GET
      path: /api/v1/bjjeire-competition
      auth: public
      response: PagedResponse<BjjEireCompetitionSummaryDto>
      params: page (>=1, default 1), pageSize (1..100, default 20)
      notes: upcoming only = status PUBLISHED and date >= today in Europe/Dublin; ordered by date then name; the cache key holds the Irish date
      covers: ["#5002", "#3006", "#3007"]
    - method: GET
      path: /api/v1/bjjeire-competition/{slug}
      auth: public
      response: BjjEireCompetitionDto   # details, fee, window, registrationState, divisions
      slug_rule: lowercase letters, digits and hyphens; the word admin is reserved and rejected on create and update
      notes: registrationState is NOT_OPEN | OPEN | CLOSED | FULL, computed by the API
      covers: ["#5002", "#5003"]
    - method: GET
      path: /api/v1/bjjeire-competition/{id}/competitor
      auth: public
      response: DivisionCompetitorsDto[]   # per division: displayName, academy, affiliation
      covers: ["#5015"]
    - method: GET
      path: /api/v1/bjjeire-competition/{id}/leaderboard
      auth: public
      response: LeaderboardDto   # podiums[], academyRanking[], affiliationRanking[], winners?
      notes: "404 for a draft, cancelled or unknown id. Podiums in the competition's division order, each with pointsAwarded (false when fewer than two competitors were confirmed in the division when its result was recorded, FR-035). Rankings carry rank (shared when level on points, golds, silvers, bronzes), name, points, gold, silver, bronze. winners (academies[], affiliations[]; several = joint) only when FINISHED. Names, academies and affiliations only: no sign-up or competitor id"
      covers: ["#5028", "#5029", "#5030", "#5031", "#5032", "#5034", "#5040", "#5041"]

    # ---- Competition: admin ---------------------------------------------------
    - method: GET
      path: /api/v1/bjjeire-competition/admin
      auth: admin
      response: PagedResponse<BjjEireCompetitionSummaryDto>   # includes DRAFT; latest day first
      covers: ["#5001", "#5004"]
    - method: GET
      path: /api/v1/bjjeire-competition/admin/{id}
      auth: admin
      response: BjjEireCompetitionDto   # any status; 404 unknown id
      notes: added in slice 1 so the organiser can open a draft, which the public slug route never serves
      covers: ["#5001", "#5004"]
    - method: POST
      path: /api/v1/bjjeire-competition
      auth: admin
      request: CreateBjjEireCompetitionCommand
      response: 201 BjjEireCompetitionDto (status DRAFT); Location /api/v1/bjjeire-competition/admin/{id}
      conflicts: [conflict]   # slug taken
      covers: ["#5001", "#5004"]
    - method: PUT
      path: /api/v1/bjjeire-competition/{id}
      auth: admin
      request: UpdateBjjEireCompetitionCommand   # details, fee, window, limit, full division list
      conflicts: [division-has-signups, conflict]   # conflict: stale version, finished or cancelled, or slug taken; no-divisions / invalid-window when already published
      notes: version (required) is the one the edit started from, a stale one is 409 and a missing one 400; an existing division is sent with its id and keeps it; a division without an id is new; an unknown id is 400 UNKNOWN_DIVISION; a repeated division is 400 DUPLICATE_DIVISION
      covers: ["#5004", "#5005"]
    - method: POST
      path: /api/v1/bjjeire-competition/{id}/publish
      auth: admin
      conflicts: [no-divisions, invalid-window, conflict]   # conflict: not a draft, or changed by another save while publishing
      covers: ["#5002", "#5004"]
    - method: POST
      path: /api/v1/bjjeire-competition/{id}/cancel
      auth: admin
      response: BjjEireCompetitionDto (status CANCELLED)
      conflicts: [conflict]   # finished
      notes: "refunds every CONFIRMED registration in full (key refund-<registrationId>), ends unpaid holds, and emails each competitor. Safe to repeat: a second call on a CANCELLED competition retries only refunds that failed (under a new key, refund-<registrationId>-<attempt>, since Stripe replays a reused key) or never reached Stripe; Stripe refuses to refund more than was paid"
      covers: ["#5026"]
    - method: POST
      path: /api/v1/bjjeire-competition/{id}/finish
      auth: admin
      response: BjjEireCompetitionDto (status FINISHED)
      conflicts: [conflict]   # a draft or cancelled competition; finishing a finished one returns it unchanged
      notes: results can still be corrected after finishing; the winners are recomputed
      covers: ["#5041"]
    - method: GET
      path: /api/v1/bjjeire-competition/admin/{id}/result
      auth: admin
      response: AdminDivisionResultDto[]   # per division in order: divisionId, result? (sign-up ids, recordedAt), competitors[] (registrationId, displayName, academy, affiliation; CONFIRMED only)
      notes: added in slice 5 for the results tab, because the public leaderboard carries no sign-up id. Admin only
      covers: ["#5028", "#5035"]
    - method: PUT
      path: /api/v1/bjjeire-competition/{id}/division/{divisionId}/result
      auth: admin
      request: RecordResultCommand   # goldRegistrationId, silverRegistrationId?, bronzeRegistrationIds[0..2]
      response: AdminDivisionResultDto
      conflicts: [not-in-division, duplicate-medallist, conflict]   # conflict: neither published nor finished, or changed meanwhile
      errors: [400 validation when gold is missing or there are more than two bronzes, 404 unknown competition or division]
      notes: replaces any recorded result and stores the division's confirmed count with it; safe to retry. Checks the medallists again after the write and puts the earlier result back with 409 not-in-division if one was cancelled or moved meanwhile
      covers: ["#5028", "#5033", "#5035"]
    - method: DELETE
      path: /api/v1/bjjeire-competition/{id}/division/{divisionId}/result
      auth: admin
      response: 204   # also when no result was recorded
      conflicts: [conflict]
      covers: ["#5033", "#5035"]
    - method: GET
      path: /api/v1/bjjeire-competition/{id}/registration
      auth: admin
      response: PagedResponse<AdminRegistrationDto>
      fields: [registrationId, displayName, email, phone, dateOfBirth, gender, belt, academy, affiliation, academyKey, affiliationKey, division, status, amountCents, paymentStatus, refundStatus, paymentUnconfirmed, profileMismatch, createdAt]
      notes: "academyKey / affiliationKey: the grouping keys the team-merge route takes. paymentUnconfirmed: Stripe reports the session paid but no webhook confirmed it (the reconciliation check). ?format=csv returns the full list as text/csv with the same fields as columns (FR-006). Admin only: these fields never appear in a public response"
    - method: PUT
      path: /api/v1/bjjeire-competition/{id}/registration/{registrationId}/division
      auth: admin
      request: ChangeDivisionCommand   # divisionId
      response: AdminRegistrationDto
      conflicts: [already-registered, result-recorded, conflict]   # conflict: the sign-up is not confirmed
      notes: no eligibility check and allowed after registration closes (FR-007); placesTaken unchanged; refused while a result names the sign-up
    - method: POST
      path: /api/v1/bjjeire-competition/{id}/registration/{registrationId}/cancel
      auth: admin
      request: AdminCancelCommand   # refund: boolean
      response: CancellationDto
      conflicts: [result-recorded, conflict]   # conflict: the sign-up is not confirmed
    - method: POST
      path: /api/v1/bjjeire-competition/{id}/team-merge
      auth: admin
      request: MergeTeamsCommand   # kind: ACADEMY | AFFILIATION, fromKeys[], target (name), targetGymId? (ACADEMY only)
      response: TeamMergeDto   # updated: number of sign-ups rewritten
      notes: rewrites the snapshot and key on every registration of this competition whose key is in fromKeys; other competitions are untouched

    # ---- Competitor profile --------------------------------------------------
    - method: GET
      path: /api/v1/competitor/me
      auth: competitor
      response: CompetitorDto   # always 200; before the first save saved=false, email from the token, other fields null
      covers: ["#5007", "#5009"]
    - method: PUT
      path: /api/v1/competitor/me
      auth: competitor
      request: SaveCompetitorCommand
      response: CompetitorDto   # includes profileComplete and email (from the token); no id, issuer or subject
      errors: [400 UNKNOWN_GYM when academy.gymId is not in Gym]
      notes: upsert keyed by (iss, sub); safe to retry; email is never read from the body
      covers: ["#5007", "#5008", "#5010"]
    - method: GET
      path: /api/v1/competitor/me/history
      auth: competitor
      response: CompetitorHistoryDto   # gold, silver, bronze totals; competitions[] with medals, latest day first
      notes: entered = the caller's CONFIRMED sign-ups; medals from recorded results, including divisions that award no team points
      covers: ["#5039"]
    - method: DELETE
      path: /api/v1/competitor/me
      auth: competitor
      response: 204
      conflicts: [has-active-registration]
      notes: has-active-registration counts only sign-ups in a competition that is not FINISHED or CANCELLED, so a medallist can leave once it finished; removes the profile and deletes the tenant user by the oid claim; tokens of that (iss, sub) issued before the deletion are 401 (DeletedCompetitor.deletedAt), a later sign-in starts a new empty account
      covers: ["#5012"]

    # ---- Registration (sign-up) ---------------------------------------------
    - method: GET
      path: /api/v1/bjjeire-competition/{id}/eligible-division
      auth: competitor
      response: DivisionDto[]
      conflicts: [registration-not-open, profile-incomplete, under-18]
      covers: ["#5014", "#5019"]
    - method: POST
      path: /api/v1/registration
      auth: competitor
      request: CreateRegistrationCommand   # competitionId, divisionId, acceptPublicListing, acceptTerms
      response: 201 RegistrationCheckoutDto   # registrationId, checkoutUrl, holdExpiresAt
      conflicts: [registration-not-open, not-eligible, under-18, already-registered, competition-full, profile-incomplete, too-many-unpaid]
      errors: [502 payment-unavailable]   # Stripe unreachable; the place is given back
      notes: too-many-unpaid when the caller already has two AWAITING_PAYMENT registrations in this competition
      covers: ["#5015", "#5017", "#5018", "#5019", "#5020", "#5042"]
    - method: POST
      path: /api/v1/registration/{id}/checkout
      auth: competitor (owner)
      response: RegistrationCheckoutDto   # the open checkout URL again while the hold is valid; never a second session
      conflicts: [hold-expired, payment-received]   # payment-received: Stripe already took the money; the webhook confirms
      covers: ["#5016"]
    - method: GET
      path: /api/v1/registration/me
      auth: competitor
      response: RegistrationDto[]   # competition, division, amountCents, status, refund status
      covers: ["#5021"]
    - method: PUT
      path: /api/v1/registration/{id}/division
      auth: competitor (owner)
      request: ChangeDivisionCommand   # divisionId
      response: RegistrationDto
      conflicts: [registration-closed, not-eligible, already-registered, result-recorded, conflict]   # conflict: the sign-up is not confirmed
      covers: ["#5024", "#5025"]
    - method: POST
      path: /api/v1/registration/{id}/cancel
      auth: competitor (owner)
      response: CancellationDto   # refunded: boolean, refundAmountCents, refundStatus
      conflicts: [result-recorded, conflict]   # result-recorded: a recorded result names it (FR-026); conflict: not confirmed (an unpaid sign-up ends with its hold)
      notes: "GET .../cancel-preview is not provided; RegistrationDto carries refundableUntil so the SPA can warn before the call. Cancelling a cancelled sign-up again returns the same CancellationDto and changes nothing"
      covers: ["#5022", "#5023", "#5027"]
    - method: POST
      path: /api/v1/registration/stripe-webhook
      auth: stripe
      notes: see stripe-webhook.md; excluded from the published SPA Pact

  invariants:
    - existing_directory: no change to /api/v1/{gym,bjjevent,competition,store}; competitor tokens are refused on their writes ("#5036", "#5037")
    - read_only_mode: ReadOnlyModeFilter still blocks directory writes; competition, competitor and registration routes skip it and obey the BjjEireCompetitions flag ("#5038")
    - privacy: no public response carries email, dateOfBirth, phone, address, nationality or competitorId
    - ownership: a competitor route addressed by id returns 403 unless the registration belongs to the caller
    - money: integer cents, EUR; amounts are never taken from the client
    - confirmation: only the verified webhook moves a registration to CONFIRMED
    - cache_tag: BJJEIRE_COMPETITIONS_TAG, evicted by every competition, result, registration, merge and account-deletion write
    - audit: admin and competitor writes are recorded through audit.AuditRecorder

  ui_routes:   # SPA, all behind the BjjEireCompetitions feature gate
    - /competitions                         # public list
    - /competitions/:slug                   # public details, divisions, competitor list, leaderboard
    - /competitions/:slug/signup            # competitor: choose division, consent, go to checkout
    - /competitions/:slug/signup/complete   # return from checkout; polls registration until CONFIRMED
    - /account/profile                     # competitor: profile, medals, history, delete account
    - /account/signups                     # competitor: my sign-ups, cancel, change division
    - /admin/competitions                   # admin: list, create
    - /admin/competitions/:id               # admin: edit, divisions, publish, sign-ups, merge, results, finish

  pointers:
    feature_spec: specs/features/competitions.md
    design: specs/001-tournament-registration/spec.md
    database: specs/database-contracts/bjjeire-competition.md   # later collections: specs/001-tournament-registration/data-model.md
    ui_strings_file: src/bjjeire-app/src/config/content/bjjeire-competitions.ts
    test_seed: seeder/data-test/bjjeire-competitions/
    generated_types: src/bjjeire-app/src/types/generated/api.ts
    ui_strings: src/bjjeire-app/src/config/ui-content.ts
    api_routes_spa: src/bjjeire-app/src/config/api-routes.ts
    pact: src/bjjeire-app/src/contracts/pact/bjjeire-competition.pact.test.ts
    msw: src/bjjeire-app/src/testing/msw/handlers/bjjeire-competitions.ts
    test_ids: src/bjjeire-app/src/constants/bjjEireCompetitionDataTestIds.ts
