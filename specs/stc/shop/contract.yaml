feature: shop
openapi:
  served: /v3/api-docs
  artifact: ghcr.io/<owner>/bjjeire-openapi-contract
  routes:
    - method: GET
      path: /api/v1/store
      auth: public
      response: PagedResponse<StoreDto>
spa:
  routes:
    - path: /shop
      flag: Stores
      page: ShopPage
    - path: /stores/*
      redirect: /shop (replace; then Shop's own Stores gate)
  sitemap: lists /shop, never /stores
pagination:
  page: 1-based
  pageSize: max 100
filters:
  name_search: client-side only
sort: name ascending
invariants:
  - listing_excludes: isActive != true
  - feature_flag: Stores fail-closed
  - merch_flag: Merch fail-closed (FEATURE_MERCH=false); with it off /api/v1/product/** and /api/v1/order/** answer 404 before authentication (#6026, ADR-0016). Merch routes are added here as slices 2-5 ship
  - cache_tag: STORES_TAG
  - writes: not mapped on StoreController (living spec FR-003 is ahead of the API)
  - rename: only the visible name and SPA address are Shop; API path, collection, flag and test ids keep store names (#4005-#4007)
pointers:
  database: specs/database-contracts/store.md
  feature_spec: specs/features/shop.md
  pact: src/bjjeire-app/src/contracts/pact/store.pact.test.ts
  generated_types: src/bjjeire-app/src/types/generated/api.ts
  ui_strings: src/bjjeire-app/src/config/ui-content.ts
  test_ids: src/bjjeire-app/src/constants/storeDataTestIds.ts
  api_routes_spa: src/bjjeire-app/src/config/api-routes.ts
