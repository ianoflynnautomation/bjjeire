name: 'Test React Application (Browser)'
description: 'Installs dependencies and runs Vitest browser tests inside the official Playwright container'
inputs:
  working-directory:
    description: 'Directory of the React application (where package.json is)'
    required: true
runs:
  using: "composite"
  steps:
    - name: Cache npm
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: ${{ runner.os }}-npm-

    - name: Install Dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "::group::npm ci"
        npm ci
        echo "::endgroup::"

    - name: Run Browser Tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "::group::npm run test:browser"
        npm run test:browser
        echo "::endgroup::"
        echo "::notice title=Browser tests::Vitest browser suite passed"

    - name: Upload Playwright Traces
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: playwright-traces
        path: ${{ inputs.working-directory }}/src/**/__traces__
        retention-days: 7

    - name: Upload Failure Screenshots
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: playwright-screenshots
        path: ${{ inputs.working-directory }}/src/**/__screenshots__
        retention-days: 7
