name: 'Detect Changed Paths'
description: 'Single source of truth for the path filters that gate api/frontend jobs. Requires the repo to be checked out first (paths-filter diffs against the default branch on push events).'

outputs:
  frontend:
    description: 'true when the React app changed.'
    value: ${{ steps.filter.outputs.frontend }}
  java_api:
    description: 'true when the Java API module changed (source, tests, pom, Dockerfile) — gates the Maven build + test job.'
    value: ${{ steps.filter.outputs.java_api }}
  java_api_image:
    description: 'true when Java API source changed excluding tests — gates image rebuilds.'
    value: ${{ steps.filter.outputs.java_api_image }}

runs:
  using: 'composite'
  steps:
    - id: filter
      uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
      with:
        filters: |
          frontend:
            - 'src/bjjeire-app/**'
          java_api:
            - 'src/bjjeire-api/**'
          java_api_image:
            - 'src/bjjeire-api/src/main/**'
            - 'src/bjjeire-api/pom.xml'
            - 'src/bjjeire-api/Dockerfile'

    - name: Summarize detected changes
      shell: bash
      env:
        FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
        JAVA_API_CHANGED: ${{ steps.filter.outputs.java_api }}
        JAVA_API_IMAGE_CHANGED: ${{ steps.filter.outputs.java_api_image }}
      run: |
        {
          echo "### Detected changes"
          echo ""
          echo "| Layer | Changed |"
          echo "| --- | --- |"
          echo "| frontend | ${FRONTEND_CHANGED} |"
          echo "| java_api | ${JAVA_API_CHANGED} |"
          echo "| java_api_image | ${JAVA_API_IMAGE_CHANGED} |"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "::notice title=Path filter::frontend=${FRONTEND_CHANGED} java_api=${JAVA_API_CHANGED} java_api_image=${JAVA_API_IMAGE_CHANGED}"
