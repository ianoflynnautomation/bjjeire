name: Validate Data

on:
  pull_request:
    paths:
      - "seeder/data/**"
      - "seeder/data-test/**"
      - "src/bjjeire-api/src/main/java/com/bjjeire/api/common/**"
      - "src/bjjeire-api/src/main/java/com/bjjeire/api/event/**"
      - "src/bjjeire-api/src/main/java/com/bjjeire/api/gym/**"
      - "src/bjjeire-api/src/main/java/com/bjjeire/api/competition/**"
      - "src/bjjeire-api/src/main/java/com/bjjeire/api/store/**"
      - "src/bjjeire-api/src/main/java/com/bjjeire/api/seeder/**"
      - ".github/workflows/validate-data.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-data:
    name: Validate data against Domain entities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: src/bjjeire-api/pom.xml

      - name: Validate all data files deserialize strictly into Domain entities
        shell: bash
        working-directory: src/bjjeire-api
        run: |
          echo "::group::mvn package (skip tests)"
          mvn --batch-mode --no-transfer-progress -DskipTests package
          echo "::endgroup::"
          echo "::group::seeder --validate"
          java -jar target/bjjeire-api-*.jar --spring.profiles.active=seeder --validate
          echo "::endgroup::"
          echo "::notice title=Data validation::All seeder data deserializes into Domain entities"

  ireland-coordinates:
    name: Coordinates within Ireland bounding box
    runs-on: ubuntu-latest
    container:
      image: node:26-bookworm-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Check gym coordinates are [longitude, latitude] within Ireland
        shell: bash
        run: |
          echo "::group::Ireland bbox check"
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          // Ireland (island) bbox: lng -10.8 to -5.2, lat 51.3 to 55.5
          const [MIN_LNG, MAX_LNG, MIN_LAT, MAX_LAT] = [-10.8, -5.2, 51.3, 55.5];
          const files = [];
          const gymDir = 'seeder/data/gyms';
          if (fs.existsSync(gymDir)) {
            for (const f of fs.readdirSync(gymDir)) {
              if (f.endsWith('.json') && !f.startsWith('_')) files.push(path.join(gymDir, f));
            }
          }
          let checked = 0;
          let errors = 0;
          for (const file of files) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const gym of data) {
              const c = gym?.location?.coordinates?.coordinates;
              if (!Array.isArray(c) || c.length !== 2) continue;
              checked++;
              const [lng, lat] = c;
              if (lng < MIN_LNG || lng > MAX_LNG || lat < MIN_LAT || lat > MAX_LAT) {
                console.log(`::error file=${file},title=Coordinates outside Ireland::'${gym.name}' coordinates [${lng}, ${lat}] are outside Ireland. GeoJSON order is [longitude, latitude].`);
                errors++;
              }
            }
          }
          console.log(`Checked ${checked} gym coordinate(s) across ${files.length} file(s); ${errors} error(s).`);
          if (errors === 0) {
            console.log(`::notice title=Ireland bbox::All ${checked} gym coordinate(s) inside Ireland`);
          }
          process.exit(errors > 0 ? 1 : 0);
          EOF
          echo "::endgroup::"
