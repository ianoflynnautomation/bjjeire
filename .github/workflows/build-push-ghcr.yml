name: Build & Push to GHCR

on:
  workflow_call:
    inputs:
      push_images:
        description: "Whether to push built images (false = build only)."
        required: false
        type: boolean
        default: true
      changes:
        description: >-
          JSON array of matched path-filter names from the caller. Empty runs
          detect_changes in this workflow (workflow_dispatch / standalone).
        required: false
        type: string
        default: ""
      platforms:
        description: "Comma-separated buildx platforms."
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
    secrets:
      VITE_APP_MSAL_CLIENT_ID:
        required: false
      VITE_APP_MSAL_AUTHORITY:
        required: false
      VITE_APP_MSAL_API_SCOPE:
        required: false
      VITE_APP_CF_BEACON_TOKEN:
        required: false
      VITE_APP_URL:
        required: false
      VITE_APP_CONTACT_EMAIL:
        required: false
      VITE_APP_SOCIAL_INSTAGRAM_URL:
        required: false
      VITE_APP_SOCIAL_FACEBOOK_URL:
        required: false
      VITE_APP_GITHUB_URL:
        required: false
    outputs:
      java_api_image_digest:
        description: "Digest (sha256:...) of the pushed Java API image, if built."
        value: ${{ jobs.build_push_java_api.outputs.image-digest }}
      frontend_image_digest:
        description: "Digest (sha256:...) of the pushed frontend image, if built."
        value: ${{ jobs.build_push_frontend.outputs.image-digest }}
      seeder_image_digest:
        description: "Digest (sha256:...) of the pushed seeder image, if built."
        value: ${{ jobs.build_push_seeder.outputs.image-digest }}
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push built images to GHCR"
        required: false
        type: boolean
        default: true
      platforms:
        description: "Comma-separated buildx platforms"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      changes:
        description: "JSON array of path-filter names. Leave empty to auto-detect."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  detect_changes:
    name: Detect Changed Paths
    if: ${{ inputs.changes == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/detect-changes@6bba6a07ce3357aa8daeb0cb909a5b0b7ccbc5eb  # v1.6.1
        with:
          filters: .github/path-filters.yml

  build_push_java_api:
    name: Build & Push Java API Image
    needs: detect_changes
    if: |
      always() &&
      (needs.detect_changes.result == 'success' || needs.detect_changes.result == 'skipped') &&
      (
        contains(fromJSON(inputs.changes != '' && inputs.changes || needs.detect_changes.outputs.changes || '[]'), 'java_api_image') ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/')
      )
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/docker-build-push.yml@6bba6a07ce3357aa8daeb0cb909a5b0b7ccbc5eb  # v1.6.1
    with:
      image-name: bjjeire-api
      dockerfile: ./src/bjjeire-api/Dockerfile
      context: ./src/bjjeire-api
      platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
      cache-scope: bjjeire-api
      push: ${{ inputs.push_images && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
      tags: |
        type=sha,format=short
        type=raw,value=${{ github.sha }}
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
      labels: |
        org.opencontainers.image.title=bjjeire-api
        org.opencontainers.image.description=BjjEire Spring Boot 4 Java 25 API
        org.opencontainers.image.vendor=BjjEire
        org.opencontainers.image.licenses=MIT
        org.opencontainers.image.url=https://bjjeire.com

  build_push_frontend:
    name: Build & Push Frontend Image
    needs: detect_changes
    if: |
      always() &&
      (needs.detect_changes.result == 'success' || needs.detect_changes.result == 'skipped') &&
      (
        contains(fromJSON(inputs.changes != '' && inputs.changes || needs.detect_changes.outputs.changes || '[]'), 'frontend') ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/')
      )
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/docker-build-push.yml@6bba6a07ce3357aa8daeb0cb909a5b0b7ccbc5eb  # v1.6.1
    with:
      image-name: bjjeire-frontend
      dockerfile: ./src/bjjeire-app/Dockerfile
      platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
      cache-scope: bjjeire-frontend
      push: ${{ inputs.push_images && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
      tags: |
        type=sha,format=short
        type=raw,value=${{ github.sha }}
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
      labels: |
        org.opencontainers.image.title=bjjeire-frontend
        org.opencontainers.image.description=BjjEire React 19 + Vite + Caddy frontend
        org.opencontainers.image.vendor=BjjEire
        org.opencontainers.image.licenses=MIT
        org.opencontainers.image.url=https://bjjeire.com
    secrets:
      SECRET_BUILD_ARGS: |
        VITE_APP_MSAL_CLIENT_ID=${{ secrets.VITE_APP_MSAL_CLIENT_ID }}
        VITE_APP_MSAL_AUTHORITY=${{ secrets.VITE_APP_MSAL_AUTHORITY }}
        VITE_APP_MSAL_API_SCOPE=${{ secrets.VITE_APP_MSAL_API_SCOPE }}
        VITE_APP_CF_BEACON_TOKEN=${{ secrets.VITE_APP_CF_BEACON_TOKEN }}
        VITE_APP_APP_URL=${{ secrets.VITE_APP_URL }}
        VITE_APP_CONTACT_EMAIL=${{ secrets.VITE_APP_CONTACT_EMAIL }}
        VITE_APP_SOCIAL_INSTAGRAM_URL=${{ secrets.VITE_APP_SOCIAL_INSTAGRAM_URL }}
        VITE_APP_SOCIAL_FACEBOOK_URL=${{ secrets.VITE_APP_SOCIAL_FACEBOOK_URL }}
        VITE_APP_GITHUB_URL=${{ secrets.VITE_APP_GITHUB_URL }}

  build_push_seeder:
    name: Build & Push Seeder Image
    needs: detect_changes
    if: |
      always() &&
      (needs.detect_changes.result == 'success' || needs.detect_changes.result == 'skipped') &&
      (
        contains(fromJSON(inputs.changes != '' && inputs.changes || needs.detect_changes.outputs.changes || '[]'), 'frontend') ||
        contains(fromJSON(inputs.changes != '' && inputs.changes || needs.detect_changes.outputs.changes || '[]'), 'java_api_image') ||
        contains(fromJSON(inputs.changes != '' && inputs.changes || needs.detect_changes.outputs.changes || '[]'), 'seeder') ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/')
      )
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/docker-build-push.yml@6bba6a07ce3357aa8daeb0cb909a5b0b7ccbc5eb  # v1.6.1
    with:
      image-name: bjjeire-seeder
      dockerfile: ./src/bjjeire-api/seeder.Dockerfile
      context: .
      platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
      cache-scope: bjjeire-seeder
      push: ${{ inputs.push_images && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
      tags: |
        type=sha,format=short
        type=raw,value=${{ github.sha }}
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
      labels: |
        org.opencontainers.image.title=bjjeire-seeder
        org.opencontainers.image.description=BjjEire MongoDB seeder
        org.opencontainers.image.vendor=BjjEire
        org.opencontainers.image.licenses=MIT
        org.opencontainers.image.url=https://bjjeire.com
