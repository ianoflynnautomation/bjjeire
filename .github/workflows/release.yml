name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release_please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 5
    outputs:
      api_released: ${{ steps.parse.outputs.api_released }}
      api_tag: ${{ steps.parse.outputs.api_tag }}
      api_version: ${{ steps.parse.outputs.api_version }}
      frontend_released: ${{ steps.parse.outputs.frontend_released }}
      frontend_tag: ${{ steps.parse.outputs.frontend_tag }}
      frontend_version: ${{ steps.parse.outputs.frontend_version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Parse release-please outputs (manifest-anchored, path-key-agnostic)
        id: parse
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
        run: |
          set -euo pipefail
          PATHS="${PATHS_RELEASED:-[]}"
          if [ -z "$PATHS" ] || [ "$PATHS" = "null" ]; then PATHS='[]'; fi
          echo "::notice title=paths_released::$PATHS"

          released() {
            echo "$PATHS" | jq -e --arg p "$1" 'index($p) != null' >/dev/null \
              && echo "true" || echo "false"
          }
          version_of() {
            jq -r --arg p "$1" '.[$p]' .release-please-manifest.json
          }

          API_RELEASED=$(released "src/bjjeire-api")
          FRONTEND_RELEASED=$(released "src/bjjeire-app")
          API_VERSION=$(version_of "src/bjjeire-api")
          FRONTEND_VERSION=$(version_of "src/bjjeire-app")

          {
            echo "api_released=$API_RELEASED"
            echo "api_tag=api-v${API_VERSION}"
            echo "api_version=$API_VERSION"
            echo "frontend_released=$FRONTEND_RELEASED"
            echo "frontend_tag=frontend-v${FRONTEND_VERSION}"
            echo "frontend_version=$FRONTEND_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "::notice title=Resolved::api_released=$API_RELEASED api_version=$API_VERSION | frontend_released=$FRONTEND_RELEASED frontend_version=$FRONTEND_VERSION"

  publish_api_artifacts:
    name: Publish API Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: release_please
    if: needs.release_please.outputs.api_released == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: src/bjjeire-api/pom.xml

      - name: Package bootable jar
        shell: bash
        working-directory: src/bjjeire-api
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ needs.release_please.outputs.api_tag }}
          files: src/bjjeire-api/target/bjjeire-api-*.jar

  publish_frontend_artifacts:
    name: Publish Frontend Release Artifacts
    runs-on: ubuntu-latest
    container:
      image: node:26-bookworm-slim
    permissions:
      contents: write
    needs: release_please
    if: needs.release_please.outputs.frontend_released == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        working-directory: src/bjjeire-app
        shell: bash
        run: npm ci

      - name: Build
        working-directory: src/bjjeire-app
        env:
          VITE_APP_API_URL: /api
          VITE_APP_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_APP_MSAL_CLIENT_ID: ${{ secrets.VITE_APP_MSAL_CLIENT_ID }}
          VITE_APP_MSAL_AUTHORITY: ${{ secrets.VITE_APP_MSAL_AUTHORITY }}
          VITE_APP_MSAL_API_SCOPE: ${{ secrets.VITE_APP_MSAL_API_SCOPE }}
          VITE_APP_CONTACT_EMAIL: ${{ secrets.VITE_APP_CONTACT_EMAIL }}
          VITE_APP_SOCIAL_INSTAGRAM_URL: ${{ secrets.VITE_APP_SOCIAL_INSTAGRAM_URL }}
          VITE_APP_SOCIAL_FACEBOOK_URL: ${{ secrets.VITE_APP_SOCIAL_FACEBOOK_URL }}
          VITE_APP_GITHUB_URL: ${{ secrets.VITE_APP_GITHUB_URL }}
          VITE_APP_CF_BEACON_TOKEN: ${{ secrets.VITE_APP_CF_BEACON_TOKEN }}
        shell: bash
        run: npm run build

      - name: Archive dist
        shell: bash
        run: tar -czf frontend-dist.tar.gz -C src/bjjeire-app dist

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ needs.release_please.outputs.frontend_tag }}
          files: frontend-dist.tar.gz

  # Retag the already-promoted :main digest. ci-main built and accepted these
  # images; rebuilding here would ignore that gate and double the build cost.
  tag_release_images:
    name: Tag Release Images from Main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release_please
    if: >
      needs.release_please.outputs.api_released == 'true' ||
      needs.release_please.outputs.frontend_released == 'true'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      API_RELEASED: ${{ needs.release_please.outputs.api_released }}
      API_VERSION: ${{ needs.release_please.outputs.api_version }}
      FRONTEND_RELEASED: ${{ needs.release_please.outputs.frontend_released }}
      FRONTEND_VERSION: ${{ needs.release_please.outputs.frontend_version }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Tag :main as semver and latest
        shell: bash
        run: |
          set -euo pipefail
          retag() {
            local name="$1" version="$2"
            local ref="${REGISTRY}/${OWNER}/${name}"
            echo "::group::${name} v${version}"
            if ! docker buildx imagetools inspect "${ref}:main" >/dev/null 2>&1; then
              echo "::error title=Missing main tag::${ref}:main does not exist — wait for ci-main promote, then re-run"
              exit 1
            fi
            docker buildx imagetools create \
              --tag "${ref}:v${version}" \
              --tag "${ref}:latest" \
              "${ref}:main"
            echo "::notice title=Tagged::${ref}:v${version} and :latest from :main"
            echo "::endgroup::"
          }
          if [ "${API_RELEASED}" = "true" ]; then
            retag bjjeire-api "${API_VERSION}"
            retag bjjeire-seeder "${API_VERSION}"
          fi
          if [ "${FRONTEND_RELEASED}" = "true" ]; then
            retag bjjeire-frontend "${FRONTEND_VERSION}"
          fi
