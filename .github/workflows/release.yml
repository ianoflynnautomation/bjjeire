name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 5
    outputs:
      api_released: ${{ steps.parse.outputs.api_released }}
      api_tag: ${{ steps.parse.outputs.api_tag }}
      api_version: ${{ steps.parse.outputs.api_version }}
      frontend_released: ${{ steps.parse.outputs.frontend_released }}
      frontend_tag: ${{ steps.parse.outputs.frontend_tag }}
      frontend_version: ${{ steps.parse.outputs.frontend_version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Parse release-please outputs (manifest-anchored, path-key-agnostic)
        id: parse
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
        run: |
          set -euo pipefail
          PATHS="${PATHS_RELEASED:-[]}"
          if [ -z "$PATHS" ] || [ "$PATHS" = "null" ]; then PATHS='[]'; fi
          echo "::notice title=paths_released::$PATHS"

          released() {
            echo "$PATHS" | jq -e --arg p "$1" 'index($p) != null' >/dev/null \
              && echo "true" || echo "false"
          }
          version_of() {
            jq -r --arg p "$1" '.[$p]' .release-please-manifest.json
          }

          API_RELEASED=$(released "src/bjjeire-api")
          FRONTEND_RELEASED=$(released "src/bjjeire-app")
          API_VERSION=$(version_of "src/bjjeire-api")
          FRONTEND_VERSION=$(version_of "src/bjjeire-app")

          {
            echo "api_released=$API_RELEASED"
            echo "api_tag=api-v${API_VERSION}"
            echo "api_version=$API_VERSION"
            echo "frontend_released=$FRONTEND_RELEASED"
            echo "frontend_tag=frontend-v${FRONTEND_VERSION}"
            echo "frontend_version=$FRONTEND_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "::notice title=Resolved::api_released=$API_RELEASED api_version=$API_VERSION | frontend_released=$FRONTEND_RELEASED frontend_version=$FRONTEND_VERSION"

  publish-api-artifacts:
    name: Publish API Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: release-please
    if: needs.release-please.outputs.api_released == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: src/bjjeire-api/pom.xml

      - name: Package bootable jar
        shell: bash
        working-directory: src/bjjeire-api
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ needs.release-please.outputs.api_tag }}
          files: src/bjjeire-api/target/bjjeire-api-*.jar

  publish-frontend-artifacts:
    name: Publish Frontend Dist Artifacts
    runs-on: ubuntu-latest
    container:
      image: node:26-bookworm-slim
    permissions:
      contents: write
    needs: release-please
    if: needs.release-please.outputs.frontend_released == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        working-directory: src/bjjeire-app
        shell: bash
        run: npm ci

      - name: Build
        working-directory: src/bjjeire-app
        env:
          VITE_APP_API_URL: /api
          VITE_APP_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_APP_MSAL_CLIENT_ID: ${{ secrets.VITE_APP_MSAL_CLIENT_ID }}
          VITE_APP_MSAL_AUTHORITY: ${{ secrets.VITE_APP_MSAL_AUTHORITY }}
          VITE_APP_MSAL_API_SCOPE: ${{ secrets.VITE_APP_MSAL_API_SCOPE }}
          VITE_APP_CONTACT_EMAIL: ${{ secrets.VITE_APP_CONTACT_EMAIL }}
          VITE_APP_SOCIAL_INSTAGRAM_URL: ${{ secrets.VITE_APP_SOCIAL_INSTAGRAM_URL }}
          VITE_APP_SOCIAL_FACEBOOK_URL: ${{ secrets.VITE_APP_SOCIAL_FACEBOOK_URL }}
          VITE_APP_GITHUB_URL: ${{ secrets.VITE_APP_GITHUB_URL }}
          VITE_APP_CF_BEACON_TOKEN: ${{ secrets.VITE_APP_CF_BEACON_TOKEN }}
        shell: bash
        run: npm run build

      - name: Archive dist
        shell: bash
        run: tar -czf frontend-dist.tar.gz -C src/bjjeire-app dist

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ needs.release-please.outputs.frontend_tag }}
          files: frontend-dist.tar.gz

  build-push-api-image:
    name: Build & Push API Image (Release)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    needs: release-please
    if: needs.release-please.outputs.api_released == 'true'
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/docker-build-push.yml@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
    with:
      image-name: bjjeire-api
      dockerfile: ./src/bjjeire-api/Dockerfile
      context: ./src/bjjeire-api
      cache-scope: bjjeire-api-main
      tags: |
        type=raw,value=v${{ needs.release-please.outputs.api_version }}
        type=raw,value=latest
      labels: |
        org.opencontainers.image.title=bjjeire-api
        org.opencontainers.image.version=${{ needs.release-please.outputs.api_version }}
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
      build-args: |
        APP_VERSION=${{ needs.release-please.outputs.api_version }}

  build-push-seeder-image:
    name: Build & Push Seeder Image (Release)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    needs: release-please
    if: needs.release-please.outputs.api_released == 'true'
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/docker-build-push.yml@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
    with:
      image-name: bjjeire-seeder
      dockerfile: ./src/bjjeire-api/seeder.Dockerfile
      cache-scope: bjjeire-seeder-main
      tags: |
        type=raw,value=v${{ needs.release-please.outputs.api_version }}
        type=raw,value=latest
      labels: |
        org.opencontainers.image.title=bjjeire-seeder
        org.opencontainers.image.version=${{ needs.release-please.outputs.api_version }}
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
      build-args: |
        APP_VERSION=${{ needs.release-please.outputs.api_version }}

  build-push-frontend-image:
    name: Build & Push Frontend Image (Release)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    needs: release-please
    if: needs.release-please.outputs.frontend_released == 'true'
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/docker-build-push.yml@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
    with:
      image-name: bjjeire-frontend
      dockerfile: ./src/bjjeire-app/Dockerfile
      cache-scope: bjjeire-frontend-main
      tags: |
        type=raw,value=v${{ needs.release-please.outputs.frontend_version }}
        type=raw,value=latest
      labels: |
        org.opencontainers.image.title=bjjeire-frontend
        org.opencontainers.image.version=${{ needs.release-please.outputs.frontend_version }}
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
      build-args: |
        APP_VERSION=${{ needs.release-please.outputs.frontend_version }}
    secrets:
      # Public config baked into the SPA bundle — not credentials.
      SECRET_BUILD_ARGS: |
        VITE_APP_MSAL_CLIENT_ID=${{ secrets.VITE_APP_MSAL_CLIENT_ID }}
        VITE_APP_MSAL_AUTHORITY=${{ secrets.VITE_APP_MSAL_AUTHORITY }}
        VITE_APP_MSAL_API_SCOPE=${{ secrets.VITE_APP_MSAL_API_SCOPE }}
        VITE_APP_CF_BEACON_TOKEN=${{ secrets.VITE_APP_CF_BEACON_TOKEN }}
        VITE_APP_APP_URL=${{ secrets.VITE_APP_URL }}
        VITE_APP_CONTACT_EMAIL=${{ secrets.VITE_APP_CONTACT_EMAIL }}
        VITE_APP_SOCIAL_INSTAGRAM_URL=${{ secrets.VITE_APP_SOCIAL_INSTAGRAM_URL }}
        VITE_APP_SOCIAL_FACEBOOK_URL=${{ secrets.VITE_APP_SOCIAL_FACEBOOK_URL }}
        VITE_APP_GITHUB_URL=${{ secrets.VITE_APP_GITHUB_URL }}

  purge-cloudflare-cache:
    name: Purge Cloudflare CDN Cache
    runs-on: ubuntu-latest
    needs: [release-please, build-push-frontend-image]
    if: needs.release-please.outputs.frontend_released == 'true'
    timeout-minutes: 5
    steps:
      - name: Purge index.html from Cloudflare edge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          script: |
            const { CLOUDFLARE_ZONE_ID, CLOUDFLARE_API_TOKEN } = process.env;
            core.setSecret(CLOUDFLARE_API_TOKEN);
            const files = [
              "https://bjjeire.com/",
              "https://bjjeire.com/index.html",
              "https://www.bjjeire.com/",
              "https://www.bjjeire.com/index.html",
            ];
            core.startGroup("Cloudflare purge request");
            core.info(`Zone: ${CLOUDFLARE_ZONE_ID}`);
            core.info(`Files: ${files.join(", ")}`);
            const res = await fetch(
              `https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${CLOUDFLARE_API_TOKEN}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ files }),
              },
            );
            const body = await res.json();
            core.endGroup();
            if (!res.ok || body.success !== true) {
              core.error(
                `Cloudflare purge failed (HTTP ${res.status}): ${JSON.stringify(body.errors ?? body)}`,
                { title: "Cloudflare purge" },
              );
              core.setFailed("Cloudflare cache purge failed");
              return;
            }
            core.notice(`Purged ${files.length} URL(s) from Cloudflare`, {
              title: "Cloudflare purge",
            });
            await core.summary
              .addHeading("Cloudflare cache purge", 3)
              .addRaw(`Zone \`${CLOUDFLARE_ZONE_ID}\` — ${files.length} URL(s) purged.`)
              .addList(files)
              .write();
