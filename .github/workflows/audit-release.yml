name: Audit Release Report

# Dedicated re-run pack for release / dispatch. PR and main already package
# live results after each test job and merge via audit-report.yml.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      seed_samples:
        description: "Use bundled Cucumber/Playwright fixtures (demo the PDF only)."
        type: boolean
        default: false
      attach_to_tag:
        description: "Existing release tag to attach the PDF to. Empty skips attach."
        type: string
        required: false
        default: ""
      environment:
        description: "Target environment label"
        type: choice
        options: [Staging, Pre-Prod, Production-DryRun, CI]
        default: Staging

concurrency:
  group: audit-release-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Generate executive test report (GitHub Release)
    permissions:
      contents: write
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/audit-release.yml@141b7b1d3328f0b2e9fcb886c1a5ff1f4e74bf22  # v1.5.0
    with:
      java-working-directory: src/bjjeire-api
      frontend-working-directory: src/bjjeire-app
      java-version: "25"
      frontend-unit-project: unit
      frontend-integration-project: integration
      frontend-env: HUSKY=0
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'Staging' }}
      seed-samples: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_samples || false }}
      attach-to-tag: ${{ github.event.release.tag_name || inputs.attach_to_tag }}
      product: BjjEire
      title: BjjEire GitHub Release — Audit-Ready Compliance Release Report
      artifact-name: bjjeire-github-release-audit-report
      artifact-retention-days: 90
      fail-on-test-failure: true
      runs-on: ubuntu-latest
