name: Cleanup Artifacts

on:
  schedule:
    - cron: "0 3 * * 0" # Every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Delete workflow runs older than this many days"
        required: false
        default: "30"
      dry_run:
        description: "Dry run — print what would be deleted without deleting"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  cleanup_artifacts:
    name: Cleanup Artifacts
    permissions:
      actions: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/cleanup-artifacts.yml@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
    with:
      retention-days: ${{ fromJSON(github.event.inputs.retention_days || '30') }}
      dry-run: ${{ (github.event.inputs.dry_run || 'false') == 'true' }}
