name: CI PR Validation

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "logs/**"
      - ".gitattributes"
      - ".gitignore"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint_workflows:
    name: Lint Workflows
    permissions:
      contents: read
      checks: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/lint-workflows.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      zizmor-enforce: false

  detect_changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/detect-changes@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
        with:
          filters: .github/path-filters.yml

  security_scan:
    name: Security Scan
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/security-scan.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      dependency-review-fail-on-severity: high
      dependency-review-comment-summary: on-failure
      sast-configs: "p/java p/typescript p/react"
      sast-severity: ERROR
      sast-enforce: false

  java_build_test:
    name: Java Build & Test
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'java_api')
    permissions:
      contents: read
      checks: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/maven-build-test.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      working-directory: src/bjjeire-api
      java-version: "25"
      maven-goals: verify
      publish-test-report: true
      test-report-name: Java Test Results

  generate_openapi_contract:
    name: Generate OpenAPI Contract
    runs-on: ubuntu-latest
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'java_api')
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: src/bjjeire-api/pom.xml
      - name: Generate current OpenAPI contract (springdoc)
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/maven-openapi-export@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
        with:
          working-directory: src/bjjeire-api
          it-test: OpenApiContractIT
          output-path: ${{ github.workspace }}/artifacts/openapi/openapi-v1.json
      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openapi-v1-json
          path: artifacts/openapi/openapi-v1.json
          if-no-files-found: error
          retention-days: 30

  check_openapi_breaking:
    name: Check OpenAPI Breaking Changes
    runs-on: ubuntu-latest
    needs: [generate_openapi_contract]
    if: needs.generate_openapi_contract.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download current OpenAPI contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: openapi-v1-json
          path: artifacts/openapi
      - name: Compare against last published contract
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/openapi-breaking-gate@a9bc3cb4b8ea83909408c94409b9de360160b96b  # v1.8.0
        with:
          current-spec: artifacts/openapi/openapi-v1.json
          image: ghcr.io/${{ github.repository_owner }}/bjjeire-openapi-contract
          token: ${{ github.token }}
          user: ${{ github.actor }}
          err-ignore: contracts/openapi-accepted-breaks.txt

  check_frontend_api_compat:
    name: Check Frontend API Compatibility
    needs: [generate_openapi_contract]
    if: needs.generate_openapi_contract.result == 'success'
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@f69cd6a0c7977cb516ae8f7fe8fbdb1b7c1bc0a1  # npm download cache
    with:
      job-name: Check Frontend API Compatibility
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 10
      env-vars: |
        HUSKY=0
      download-artifact-name: openapi-v1-json
      download-artifact-path: src/bjjeire-app
      commands: |
        npm run gen:api-types:ci
        npx tsc --noEmit

  frontend_typecheck:
    name: Frontend Typecheck
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@f69cd6a0c7977cb516ae8f7fe8fbdb1b7c1bc0a1  # npm download cache
    with:
      job-name: Frontend Typecheck
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
      commands: npx tsc --noEmit

  frontend_lint:
    name: Frontend Lint
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@f69cd6a0c7977cb516ae8f7fe8fbdb1b7c1bc0a1  # npm download cache
    with:
      job-name: Frontend Lint
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
      commands: |
        npx eslint src --max-warnings 0
        npx prettier --check src/

  frontend_unit:
    name: Frontend Unit Tests
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@f69cd6a0c7977cb516ae8f7fe8fbdb1b7c1bc0a1  # npm download cache
    with:
      job-name: Frontend Unit Tests
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
      commands: |
        mkdir -p test-results
        npx vitest run --project unit --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-unit.xml
      artifact-name: frontend-vitest-unit
      artifact-path: src/bjjeire-app/test-results/vitest-unit.xml
      artifact-if-no-files-found: error
      upload-artifact-always: true
      artifact-retention-days: 7

  frontend_integration:
    name: Frontend Integration Tests
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@f69cd6a0c7977cb516ae8f7fe8fbdb1b7c1bc0a1  # npm download cache
    with:
      job-name: Frontend Integration Tests
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
      commands: |
        mkdir -p test-results
        npx vitest run --project integration --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-integration.xml
      artifact-name: frontend-vitest-integration
      artifact-path: src/bjjeire-app/test-results/vitest-integration.xml
      artifact-if-no-files-found: error
      upload-artifact-always: true
      artifact-retention-days: 7

  frontend_pact:
    name: Frontend Pact
    needs: detect_changes
    if: |
      contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend') ||
      contains(fromJSON(needs.detect_changes.outputs.changes), 'java_api')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@f69cd6a0c7977cb516ae8f7fe8fbdb1b7c1bc0a1  # npm download cache
    with:
      job-name: Frontend Pact
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
      commands: npm run test:pact
      artifact-name: frontend-pact
      artifact-path: src/bjjeire-app/pacts/*.json
      artifact-if-no-files-found: error
      artifact-retention-days: 7

  frontend_build:
    name: Frontend Build
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@f69cd6a0c7977cb516ae8f7fe8fbdb1b7c1bc0a1  # npm download cache
    with:
      job-name: Frontend Build
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
        SERVICES_API_HTTPS_0=https://api-ci-placeholder:443
      commands: npx vite build

  verify_pact_provider:
    name: Verify Pact Provider
    needs: frontend_pact
    if: needs.frontend_pact.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download consumer pact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: frontend-pact
          path: src/bjjeire-api/pacts
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: src/bjjeire-api/pom.xml
      - name: Verify the SPA pact against the API
        working-directory: src/bjjeire-api
        run: |
          set -euo pipefail
          echo "::group::mvn verify -Ppact-provider"
          mvn --batch-mode --no-transfer-progress verify -Ppact-provider
          echo "::endgroup::"
          echo "::notice title=Pact provider::BjjEireApi satisfied the consumer pact"

  test_frontend_browser:
    name: Test Frontend Browser
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@f69cd6a0c7977cb516ae8f7fe8fbdb1b7c1bc0a1  # npm download cache
    with:
      job-name: Test Frontend Browser
      working-directory: src/bjjeire-app
      container-image: mcr.microsoft.com/playwright:v1.61.0-noble
      cache-key-prefix: bjjeire-app
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
      commands: npm run test:browser
      failure-artifact-name: playwright-diagnostics
      failure-artifact-path: |
        src/bjjeire-app/src/**/__traces__
        src/bjjeire-app/src/**/__screenshots__
      artifact-retention-days: 7

  compose_smoke:
    name: Compose Smoke Tests
    needs: detect_changes
    if: |
      contains(fromJSON(needs.detect_changes.outputs.changes), 'compose') ||
      contains(github.event.pull_request.labels.*.name, 'run-smoke')
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      pages: write
      pull-requests: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/playwright-docker-tests.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      compose-files: |
        docker-compose.yml
        docker-compose.override.java-local.yml
        docker-compose.override.ci.yml
      compose-pre-up-script: .github/scripts/smoke-pre-up.sh
      seed-command: docker compose run --rm seeder
      compose-health-url: http://localhost:5003/health
      base-url: http://localhost:3000
      api-url: http://localhost:5003
      test-repo: ianoflynnautomation/bjjeire-tests
      test-tags: "@smoke"
      playwright-projects: |
        api
        chromium-desktop
      project-shard-overrides: |
        api=2
        chromium-desktop=2
      config-map: |
        api=playwright.api.config.ts
      default-config: playwright.ui.config.ts
      runner-image: ghcr.io/ianoflynnautomation/bjjeire-playwright
      runner-workdir: /home/pwuser/app
      compose-project-prefix: bjj
      env-vars: |
        ACCEPT_INVALID_CERTS=true
      publish-report: false
      fail-on-flaky: true
      fail-fast: false
    secrets:
      test-env-vars: |
        MONGO_URL=${{ secrets.EPHEMERAL_MONGO_URL }}
        MONGO_DB=${{ secrets.EPHEMERAL_MONGO_DB }}
        AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
        AZURE_TESTS_CLIENT_ID=${{ secrets.AZURE_TESTS_CLIENT_ID }}
        AZURE_TESTS_CLIENT_SECRET=${{ secrets.AZURE_TESTS_CLIENT_SECRET }}
        AZURE_API_SCOPE=${{ secrets.AZURE_API_SCOPE }}
        AZURE_AUTHORITY=${{ secrets.AZURE_AUTHORITY }}
        CF_ACCESS_CLIENT_ID=${{ secrets.CF_ACCESS_CLIENT_ID }}
        CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        PW_TEST_USER=${{ secrets.PW_TEST_USER }}
        PW_TEST_PASSWORD=${{ secrets.PW_TEST_PASSWORD }}
        OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
        OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  # DELIBERATELY ABSENT FROM pr_complete: advisory analysis must not be able to
  # block a merge. It shows red in the checks list when it breaks, which is the
  # right amount of noise for something that gates nothing.
  atest_analyze:
    name: Flake Analysis (atest)
    needs: compose_smoke
    if: always() && needs.compose_smoke.result != 'skipped'
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      pull-requests: write
    uses: ianoflynnautomation/aplaytest/.github/workflows/atest-analyze.yml@04f907064c4b6a82eadd4bc454b12bf9a46665a2  # v0.1.1
    with:
      results-artifact: playwright-docker-json-results
      history-account: ${{ vars.ATEST_HISTORY_ACCOUNT }}
      history-prefix: bjjeire-java
      history-window-days: 90
      min-runs: 2
      half-life-days: 7
      flake-threshold: 0.15
      window-runs: 50
      comment-on-pr: true
      atest-tag: ${{ vars.ATEST_VERSION != '' && vars.ATEST_VERSION || '0.1.1' }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  package_java_reports:
    name: Package Java reports for PR audit PDF
    needs: java_build_test
    if: always() && (needs.java_build_test.result == 'success' || needs.java_build_test.result == 'failure')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/package-test-report.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      download-artifact-name: maven-test-results
      download-artifact-pattern: ""
      source: java
      job-name: java_build_test
      skip-reason: Maven Surefire/Failsafe XML was not uploaded by java_build_test on the PR validation pipeline
      fail-if-empty: false
      artifact-retention-days: 14
      runs-on: ubuntu-latest
      packages: |
        unit|java|**/surefire-reports/*.xml
        integration|java|**/failsafe-reports/*.xml

  package_frontend_reports:
    name: Package frontend reports for PR audit PDF
    needs: [frontend_unit, frontend_integration]
    if: |
      always() && (
        needs.frontend_unit.result == 'success' || needs.frontend_unit.result == 'failure' ||
        needs.frontend_integration.result == 'success' || needs.frontend_integration.result == 'failure'
      )
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/package-test-report.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      download-artifact-name: ""
      download-artifact-pattern: frontend-vitest-*
      source: frontend
      job-name: frontend_unit
      skip-reason: Vitest JUnit XML was not uploaded by frontend_unit or frontend_integration on the PR validation pipeline
      fail-if-empty: false
      artifact-retention-days: 14
      runs-on: ubuntu-latest
      packages: |
        unit|frontend|**/vitest-unit.xml
        integration|frontend|**/vitest-integration.xml

  package_compose_reports:
    name: Package compose smoke reports for PR audit PDF
    needs: compose_smoke
    if: always() && (needs.compose_smoke.result == 'success' || needs.compose_smoke.result == 'failure')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/package-test-report.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      download-artifact-name: playwright-docker-json-results
      download-artifact-pattern: ""
      source: compose
      job-name: compose_smoke
      skip-reason: Playwright JSON was not uploaded by compose_smoke on the PR validation pipeline
      fail-if-empty: false
      artifact-retention-days: 14
      runs-on: ubuntu-latest
      packages: |
        system|compose|**/*.json

  audit_report:
    name: Generate executive test report (PR validation)
    needs:
      - package_java_reports
      - package_frontend_reports
      - package_compose_reports
    if: always()
    permissions:
      contents: write
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/audit-report.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      product: BjjEire
      title: BjjEire PR Validation — Audit-Ready Compliance Release Report
      environment: PR validation
      required-categories: unit,integration,acceptance,system
      strict-missing: false
      fail-on-test-failure: true
      artifact-name: bjjeire-pr-audit-release-report
      artifact-retention-days: 14
      download-pattern: report-*
      attach-to-tag: ""
      runs-on: ubuntu-latest

  pr_complete:
    name: PR Checks Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint_workflows
      - detect_changes
      - security_scan
      - java_build_test
      - generate_openapi_contract
      - check_openapi_breaking
      - check_frontend_api_compat
      - frontend_typecheck
      - frontend_lint
      - frontend_unit
      - frontend_integration
      - frontend_pact
      - verify_pact_provider
      - frontend_build
      - test_frontend_browser
      - compose_smoke
      - package_java_reports
      - package_frontend_reports
      - package_compose_reports
      - audit_report
    steps:
      - name: Verify all required checks succeeded or were intentionally skipped
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/check-required-jobs@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
        with:
          needs-json: ${{ toJson(needs) }}
          summary-title: PR checks
