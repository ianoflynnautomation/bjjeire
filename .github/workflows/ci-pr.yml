name: CI PR Validation

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "logs/**"
      - ".gitattributes"
      - ".gitignore"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint_workflows:
    name: Lint Workflows
    permissions:
      contents: read
      checks: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/lint-workflows.yml@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
    with:
      zizmor-enforce: false

  detect_changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/detect-changes@f51b5ef3b6c34b56452d6bec29337e9d4240b078  # v1.3.0
        with:
          filters: .github/path-filters.yml

  security_scan:
    name: Security Scan
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/security-scan.yml@f51b5ef3b6c34b56452d6bec29337e9d4240b078  # v1.3.0
    with:
      dependency-review-fail-on-severity: high
      dependency-review-comment-summary: on-failure
      sast-configs: "p/java p/typescript p/react"
      sast-severity: ERROR
      sast-enforce: false

  java_build_test:
    name: Java Build & Test
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'java_api')
    permissions:
      contents: read
      checks: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/maven-build-test.yml@e5a0f9590443cd2705b9da764d6a9c3571cc8700  # v1.4.2
    with:
      working-directory: src/bjjeire-api
      java-version: "25"
      maven-goals: verify
      publish-test-report: true
      test-report-name: Java Test Results

  # Parallel with java_build_test — maven-build-test.yml cannot export extra
  # artifacts, so OpenAPI still uses maven-openapi-export (single IT, not full verify).
  generate_openapi_contract:
    name: Generate OpenAPI Contract
    runs-on: ubuntu-latest
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'java_api')
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: src/bjjeire-api/pom.xml
      - name: Generate current OpenAPI contract (springdoc)
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/maven-openapi-export@7852f19cc97d30c3fee0eb4db8ba4c7cca62dc1f  # v1.4.4
        with:
          working-directory: src/bjjeire-api
          it-test: OpenApiContractIT
          output-path: ${{ github.workspace }}/artifacts/openapi/openapi-v1.json
      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openapi-v1-json
          path: artifacts/openapi/openapi-v1.json
          if-no-files-found: error
          retention-days: 30

  check_openapi_breaking:
    name: Check OpenAPI Breaking Changes
    runs-on: ubuntu-latest
    needs: [generate_openapi_contract]
    if: needs.generate_openapi_contract.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download current OpenAPI contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: openapi-v1-json
          path: artifacts/openapi
      - name: Compare against last published contract
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/openapi-breaking-gate@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
        with:
          current-spec: artifacts/openapi/openapi-v1.json
          image: ghcr.io/${{ github.repository_owner }}/bjjeire-openapi-contract
          token: ${{ github.token }}
          user: ${{ github.actor }}

  check_frontend_api_compat:
    name: Check Frontend API Compatibility
    needs: [generate_openapi_contract]
    if: needs.generate_openapi_contract.result == 'success'
    permissions:
      contents: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@f51b5ef3b6c34b56452d6bec29337e9d4240b078  # v1.3.0
    with:
      job-name: Check Frontend API Compatibility
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 10
      env-vars: |
        HUSKY=0
      download-artifact-name: openapi-v1-json
      download-artifact-path: src/bjjeire-app
      commands: |
        npm run gen:api-types:ci
        npx tsc --noEmit

  frontend_build_test:
    name: Frontend Build & Test
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend')
    permissions:
      contents: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@f51b5ef3b6c34b56452d6bec29337e9d4240b078  # v1.3.0
    with:
      job-name: Frontend Build & Test
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 20
      env-vars: |
        HUSKY=0
        SERVICES_API_HTTPS_0=https://api-ci-placeholder:443
      commands: |
        npx tsc --noEmit
        npx eslint src --max-warnings 0
        npx prettier --check src/
        npx vitest run --coverage --project unit --project integration
        npm run test:pact
        npx vite build
      artifact-name: frontend-build-test
      artifact-path: |
        src/bjjeire-app/pacts/*.json
        src/bjjeire-app/coverage
      artifact-if-no-files-found: error
      upload-artifact-always: true
      artifact-retention-days: 7

  test_frontend_browser:
    name: Test Frontend Browser
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend')
    permissions:
      contents: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@f51b5ef3b6c34b56452d6bec29337e9d4240b078  # v1.3.0
    with:
      job-name: Test Frontend Browser
      working-directory: src/bjjeire-app
      container-image: mcr.microsoft.com/playwright:v1.61.0-noble
      cache-key-prefix: bjjeire-app
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
      commands: npm run test:browser
      failure-artifact-name: playwright-diagnostics
      failure-artifact-path: |
        src/bjjeire-app/src/**/__traces__
        src/bjjeire-app/src/**/__screenshots__
      artifact-retention-days: 7

  compose_smoke:
    name: Compose Smoke Tests
    needs: detect_changes
    if: |
      contains(fromJSON(needs.detect_changes.outputs.changes), 'compose') ||
      contains(github.event.pull_request.labels.*.name, 'run-smoke')
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      pages: write
      pull-requests: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/playwright-docker-tests.yml@2e9d7cdf3b650d6e3e7b0424008c8e1645d28377  # main
    with:
      compose-files: |
        docker-compose.yml
        docker-compose.override.java-local.yml
        docker-compose.override.ci.yml
      compose-pre-up-script: .github/scripts/smoke-pre-up.sh
      seed-command: docker compose run --rm seeder
      compose-health-url: http://localhost:5003/health
      base-url: http://localhost:3000
      api-url: http://localhost:5003
      test-repo: ianoflynnautomation/bjjeire-tests
      test-tags: "@smoke"
      playwright-projects: |
        api
        chromium-desktop
      project-shard-overrides: |
        api=2
        chromium-desktop=2
      config-map: |
        api=playwright.api.config.ts
      default-config: playwright.ui.config.ts
      runner-image: ghcr.io/ianoflynnautomation/bjjeire-playwright
      runner-workdir: /home/pwuser/app
      compose-project-prefix: bjj
      env-vars: |
        ACCEPT_INVALID_CERTS=true
      publish-report: false
      fail-on-flaky: false
      fail-fast: false
    secrets:
      test-env-vars: |
        MONGO_URL=${{ secrets.EPHEMERAL_MONGO_URL }}
        MONGO_DB=${{ secrets.EPHEMERAL_MONGO_DB }}
        AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
        AZURE_TESTS_CLIENT_ID=${{ secrets.AZURE_TESTS_CLIENT_ID }}
        AZURE_TESTS_CLIENT_SECRET=${{ secrets.AZURE_TESTS_CLIENT_SECRET }}
        AZURE_API_SCOPE=${{ secrets.AZURE_API_SCOPE }}
        AZURE_AUTHORITY=${{ secrets.AZURE_AUTHORITY }}
        CF_ACCESS_CLIENT_ID=${{ secrets.CF_ACCESS_CLIENT_ID }}
        CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        PW_TEST_USER=${{ secrets.PW_TEST_USER }}
        PW_TEST_PASSWORD=${{ secrets.PW_TEST_PASSWORD }}
        OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
        OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  pr_complete:
    name: PR Checks Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint_workflows
      - detect_changes
      - security_scan
      - java_build_test
      - generate_openapi_contract
      - check_openapi_breaking
      - check_frontend_api_compat
      - frontend_build_test
      - test_frontend_browser
      - compose_smoke
    steps:
      - name: Verify all required checks succeeded or were intentionally skipped
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/check-required-jobs@f51b5ef3b6c34b56452d6bec29337e9d4240b078  # v1.3.0
        with:
          needs-json: ${{ toJson(needs) }}
          summary-title: PR checks
