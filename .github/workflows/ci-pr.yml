name: CI PR Validation

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "logs/**"
      - ".gitattributes"
      - ".gitignore"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint_workflows:
    name: Lint Workflows
    permissions:
      contents: read
      checks: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/lint-workflows.yml@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
    with:
      zizmor-enforce: false

  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/detect-changes@v1.1.0
        with:
          filters: |
            frontend:
              - 'src/bjjeire-app/**'
            java_api:
              - 'src/bjjeire-api/**'
            java_api_image:
              - 'src/bjjeire-api/src/main/**'
              - 'src/bjjeire-api/pom.xml'
              - 'src/bjjeire-api/Dockerfile'
            seeder:
              - 'src/bjjeire-api/seeder.Dockerfile'
              - 'src/bjjeire-api/src/main/java/com/bjjeire/api/seeder/**'
              - 'seeder/data/**'

  security:
    name: Security
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/security-scan.yml@v1.1.0
    with:
      dependency-review-fail-on-severity: high
      dependency-review-comment-summary: on-failure
      sast-configs: "p/java p/typescript p/react"
      sast-severity: ERROR
      sast-enforce: false

  java_build_test:
    name: Java Build & Test
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.changes), 'java_api')
    permissions:
      contents: read
      checks: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/maven-build-test.yml@77d3238a8e555c7f51b256cd0301454000b0b7bf  # v1.4.0
    with:
      working-directory: src/bjjeire-api
      java-version: "25"
      maven-goals: verify
      publish-test-report: true
      test-report-name: Java Test Results

  openapi_contract:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    needs: [java_build_test]
    if: needs.java_build_test.result == 'success'
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: src/bjjeire-api/pom.xml
      - name: Generate current OpenAPI contract (springdoc)
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/maven-openapi-export@v1.1.0
        with:
          working-directory: src/bjjeire-api
          it-test: OpenApiContractIT
          output-path: ${{ github.workspace }}/artifacts/openapi/openapi-v1.json
      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openapi-v1-json
          path: artifacts/openapi/openapi-v1.json
          if-no-files-found: error
          retention-days: 30

  check_openapi_breaking:
    name: Check OpenAPI Breaking Changes
    runs-on: ubuntu-latest
    needs: [openapi_contract]
    if: needs.openapi_contract.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download current OpenAPI contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: openapi-v1-json
          path: artifacts/openapi
      - name: Compare against last published contract
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/openapi-breaking-gate@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
        with:
          current-spec: artifacts/openapi/openapi-v1.json
          image: ghcr.io/${{ github.repository_owner }}/bjjeire-openapi-contract
          token: ${{ github.token }}
          user: ${{ github.actor }}

  check_frontend_api_compat:
    name: Check Frontend API Compatibility
    needs: [openapi_contract]
    if: needs.openapi_contract.result == 'success'
    permissions:
      contents: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@v1.1.0
    with:
      job-name: Frontend API Compatibility
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 10
      env-vars: |
        HUSKY=0
      download-artifact-name: openapi-v1-json
      download-artifact-path: src/bjjeire-app
      commands: |
        npm run gen:api-types:ci
        npx tsc --noEmit

  build_frontend:
    name: Build Frontend
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.changes), 'frontend')
    permissions:
      contents: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@v1.1.0
    with:
      job-name: Build Frontend
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
        SERVICES_API_HTTPS_0=https://api-ci-placeholder:443
      commands: npm run build

  frontend_checks:
    name: Frontend Checks (lint + unit + pact)
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.changes), 'frontend')
    permissions:
      contents: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@v1.1.0
    with:
      job-name: Frontend Checks
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
      commands: |
        npx tsc --noEmit
        npx eslint src --max-warnings 0
        npx prettier --check src/
        npm test
        npm run test:pact
      artifact-name: frontend-pacts
      artifact-path: src/bjjeire-app/pacts/*.json
      artifact-if-no-files-found: error
      artifact-retention-days: 30

  test_frontend_integration:
    name: Test Frontend Integration + Coverage Gate
    needs: [frontend_checks, build_frontend]
    if: needs.frontend_checks.result == 'success' && needs.build_frontend.result == 'success'
    permissions:
      contents: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@v1.1.0
    with:
      job-name: Integration Tests + Coverage
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 10
      env-vars: |
        HUSKY=0
      commands: npm run test:coverage
      artifact-name: frontend-coverage
      artifact-path: src/bjjeire-app/coverage
      artifact-if-no-files-found: error
      upload-artifact-always: true
      artifact-retention-days: 7

  compose_smoke:
    name: Compose smoke
    needs: detect-changes
    if: |
      contains(fromJSON(needs.detect-changes.outputs.changes), 'java_api') ||
      contains(fromJSON(needs.detect-changes.outputs.changes), 'frontend') ||
      contains(fromJSON(needs.detect-changes.outputs.changes), 'seeder')
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      pages: write
      pull-requests: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/playwright-docker-tests.yml@cf8cd586a13d524028cdf41c72c2f502ac246722  # v1.2.0
    with:
      compose-files: |
        docker-compose.yml
        docker-compose.override.java-local.yml
        docker-compose.override.ci.yml
      compose-pre-up-script: .github/scripts/smoke-pre-up.sh
      seed-command: docker compose run --rm seeder
      compose-health-url: http://localhost:5003/health
      base-url: http://localhost:3000
      api-url: http://localhost:5003
      test-repo: ianoflynnautomation/bjjeire-tests
      test-tags: "@smoke"
      playwright-projects: |
        api
        chromium-desktop
      project-shard-overrides: |
        api=2
        chromium-desktop=2
      config-map: |
        api=playwright.api.config.ts
      default-config: playwright.ui.config.ts
      runner-image: ghcr.io/ianoflynnautomation/bjjeire-playwright
      runner-workdir: /home/pwuser/app
      compose-project-prefix: bjj
      env-vars: |
        ACCEPT_INVALID_CERTS=true
      publish-report: true
      fail-on-flaky: false
    secrets:
      test-env-vars: |
        MONGO_URL=${{ secrets.EPHEMERAL_MONGO_URL }}
        MONGO_DB=${{ secrets.EPHEMERAL_MONGO_DB }}
        AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
        AZURE_TESTS_CLIENT_ID=${{ secrets.AZURE_TESTS_CLIENT_ID }}
        AZURE_TESTS_CLIENT_SECRET=${{ secrets.AZURE_TESTS_CLIENT_SECRET }}
        AZURE_API_SCOPE=${{ secrets.AZURE_API_SCOPE }}
        AZURE_AUTHORITY=${{ secrets.AZURE_AUTHORITY }}
        CF_ACCESS_CLIENT_ID=${{ secrets.CF_ACCESS_CLIENT_ID }}
        CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        PW_TEST_USER=${{ secrets.PW_TEST_USER }}
        PW_TEST_PASSWORD=${{ secrets.PW_TEST_PASSWORD }}
        OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
        OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  test_frontend_browser:
    name: Test Frontend Browser
    needs: [frontend_checks, build_frontend]
    if: needs.frontend_checks.result == 'success' && needs.build_frontend.result == 'success'
    permissions:
      contents: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@v1.1.0
    with:
      job-name: Vitest Browser Suite
      working-directory: src/bjjeire-app
      container-image: mcr.microsoft.com/playwright:v1.61.0-noble
      cache-key-prefix: bjjeire-app
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
      commands: npm run test:browser
      failure-artifact-name: playwright-diagnostics
      failure-artifact-path: |
        src/bjjeire-app/src/**/__traces__
        src/bjjeire-app/src/**/__screenshots__
      artifact-retention-days: 7

  pr_complete:
    name: PR Checks Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint_workflows
      - detect-changes
      - security
      - java_build_test
      - openapi_contract
      - check_openapi_breaking
      - check_frontend_api_compat
      - build_frontend
      - frontend_checks
      - test_frontend_integration
      - test_frontend_browser
      - compose_smoke
    steps:
      - name: Verify all required checks succeeded or were intentionally skipped
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/check-required-jobs@v1.1.0
        with:
          needs-json: ${{ toJson(needs) }}
          summary-title: PR checks
