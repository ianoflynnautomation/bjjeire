name: CI Main Delivery

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "logs/**"
      - ".gitattributes"
      - ".gitignore"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/detect-changes@v1.1.0
        with:
          filters: |
            frontend:
              - 'src/bjjeire-app/**'
            java_api:
              - 'src/bjjeire-api/**'
            java_api_image:
              - 'src/bjjeire-api/src/main/**'
              - 'src/bjjeire-api/pom.xml'
              - 'src/bjjeire-api/Dockerfile'

  smoke_tests:
    name: Acceptance Tests (Docker Compose)
    needs: detect-changes
    if: |
      contains(fromJSON(needs.detect-changes.outputs.changes), 'java_api') ||
      contains(fromJSON(needs.detect-changes.outputs.changes), 'frontend')
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      pages: write
      pull-requests: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/playwright-docker-tests.yml@cf8cd586a13d524028cdf41c72c2f502ac246722  # main — flip to @v1 once v1.2.0 is released
    with:
      compose-files: |
        docker-compose.yml
        docker-compose.override.java-local.yml
        docker-compose.override.ci.yml
      compose-pre-up-script: .github/scripts/smoke-pre-up.sh
      seed-command: docker compose run --rm seeder
      compose-health-url: http://localhost:5003/health
      base-url: http://localhost:3000
      api-url: http://localhost:5003
      test-repo: ianoflynnautomation/bjjeire-tests
      test-tags: "@acceptance"
      playwright-projects: |
        api
        chromium-desktop
        firefox-desktop
        webkit-desktop
        chromium-wide
        snapshots
        a11y
        mobile-iphone
        mobile-galaxy
      project-shard-overrides: |
        api=3
        firefox-desktop=4
        webkit-desktop=3
        chromium-wide=3
        snapshots=1
        a11y=1
        mobile-iphone=1
        mobile-galaxy=1
      config-map: |
        api=playwright.api.config.ts
      default-config: playwright.ui.config.ts
      runner-image: ghcr.io/ianoflynnautomation/bjjeire-playwright
      runner-workdir: /home/pwuser/app
      compose-project-prefix: bjj
      env-vars: |
        ACCEPT_INVALID_CERTS=true
      publish-report: true
      fail-on-flaky: false
    secrets:
      test-env-vars: |
        MONGO_URL=${{ secrets.EPHEMERAL_MONGO_URL }}
        MONGO_DB=${{ secrets.EPHEMERAL_MONGO_DB }}
        AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
        AZURE_TESTS_CLIENT_ID=${{ secrets.AZURE_TESTS_CLIENT_ID }}
        AZURE_TESTS_CLIENT_SECRET=${{ secrets.AZURE_TESTS_CLIENT_SECRET }}
        AZURE_API_SCOPE=${{ secrets.AZURE_API_SCOPE }}
        AZURE_AUTHORITY=${{ secrets.AZURE_AUTHORITY }}
        CF_ACCESS_CLIENT_ID=${{ secrets.CF_ACCESS_CLIENT_ID }}
        CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        PW_TEST_USER=${{ secrets.PW_TEST_USER }}
        PW_TEST_PASSWORD=${{ secrets.PW_TEST_PASSWORD }}
        OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
        OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  java_build_test:
    name: Java Build & Test
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.changes), 'java_api')
    permissions:
      contents: read
      checks: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/maven-build-test.yml@main
    with:
      working-directory: src/bjjeire-api
      java-version: "25"
      maven-goals: verify
      publish-test-report: true
      test-report-name: Java Test Results

  generate_openapi_contract:
    name: Generate OpenAPI Contract
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      contains(fromJSON(needs.detect-changes.outputs.changes), 'java_api') ||
      contains(fromJSON(needs.detect-changes.outputs.changes), 'frontend')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: src/bjjeire-api/pom.xml
      - name: Generate OpenAPI contract (springdoc)
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/maven-openapi-export@v1.1.0
        with:
          working-directory: src/bjjeire-api
          it-test: OpenApiContractIT
          output-path: ${{ github.workspace }}/artifacts/contracts/openapi-v1.json
      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: main-openapi-contract
          path: artifacts/contracts/openapi-v1.json
          if-no-files-found: error
          retention-days: 30

  generate_pact_contract:
    name: Generate Pact Contract
    needs: detect-changes
    if: |
      contains(fromJSON(needs.detect-changes.outputs.changes), 'java_api') ||
      contains(fromJSON(needs.detect-changes.outputs.changes), 'frontend')
    permissions:
      contents: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@v1.1.0
    with:
      job-name: Generate Pact Contract
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
      commands: |
        npm run test:pact
        test -s pacts/BjjEireWeb-BjjEireApi.json || { echo "::error title=Pact contract::pacts/BjjEireWeb-BjjEireApi.json was not generated"; exit 1; }
      artifact-name: main-pact-contract
      artifact-path: src/bjjeire-app/pacts/BjjEireWeb-BjjEireApi.json
      artifact-if-no-files-found: error
      artifact-retention-days: 30

  publish_contracts_ghcr:
    name: Publish Contracts to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [smoke_tests, generate_openapi_contract, generate_pact_contract]
    timeout-minutes: 15
    env:
      OPENAPI_ARTIFACT_PATH: artifacts/contracts/openapi-v1.json
      PACT_ARTIFACT_PATH: artifacts/contracts/BjjEireWeb-BjjEireApi.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download contract artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: main-*-contract
          path: artifacts/contracts
          merge-multiple: true
      - name: Validate contract artifacts
        shell: bash
        run: |
          jq -e '.openapi and .paths' "$OPENAPI_ARTIFACT_PATH" > /dev/null
          jq -e '.consumer and .interactions' "$PACT_ARTIFACT_PATH" > /dev/null
          echo "::notice title=Contract validation::Both contract artifacts are structurally valid"
      - name: Gate — block publish on breaking changes
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/openapi-breaking-gate@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
        with:
          current-spec: ${{ env.OPENAPI_ARTIFACT_PATH }}
          image: ghcr.io/${{ github.repository_owner }}/bjjeire-openapi-contract
          token: ${{ github.token }}
          user: ${{ github.actor }}
      - name: Publish OpenAPI contract to GHCR
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/oci-push-artifact@v1.1.0
        with:
          file: ${{ env.OPENAPI_ARTIFACT_PATH }}
          image: ghcr.io/${{ github.repository_owner }}/bjjeire-openapi-contract
          artifact-type: application/vnd.bjjeire.openapi.v1
          media-type: application/vnd.oai.openapi+json
          tags: |
            ${{ github.sha }}
            main
            latest
          password: ${{ github.token }}
          summary-title: Published OpenAPI contract
      - name: Publish Pact contract to GHCR
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/oci-push-artifact@v1.1.0
        with:
          file: ${{ env.PACT_ARTIFACT_PATH }}
          image: ghcr.io/${{ github.repository_owner }}/bjjeire-web-pacts
          artifact-type: application/vnd.pact.consumer-contract
          media-type: application/vnd.pact.consumer-contract+json
          tags: |
            ${{ github.sha }}
            main
            latest
          password: ${{ github.token }}
          summary-title: Published Pact contract

  build_push:
    name: Build & Push Images
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    needs: [smoke_tests, publish_contracts_ghcr, java_build_test]
    if: |
      always() &&
      needs.smoke_tests.result == 'success' &&
      needs.publish_contracts_ghcr.result == 'success' &&
      (needs.java_build_test.result == 'success' || needs.java_build_test.result == 'skipped')
    uses: ./.github/workflows/build-push-ghcr.yml
    with:
      push_images: true
    secrets:
      VITE_APP_MSAL_CLIENT_ID: ${{ secrets.VITE_APP_MSAL_CLIENT_ID }}
      VITE_APP_MSAL_AUTHORITY: ${{ secrets.VITE_APP_MSAL_AUTHORITY }}
      VITE_APP_MSAL_API_SCOPE: ${{ secrets.VITE_APP_MSAL_API_SCOPE }}
      VITE_APP_CF_BEACON_TOKEN: ${{ secrets.VITE_APP_CF_BEACON_TOKEN }}
      VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
      VITE_APP_CONTACT_EMAIL: ${{ secrets.VITE_APP_CONTACT_EMAIL }}
      VITE_APP_SOCIAL_INSTAGRAM_URL: ${{ secrets.VITE_APP_SOCIAL_INSTAGRAM_URL }}
      VITE_APP_SOCIAL_FACEBOOK_URL: ${{ secrets.VITE_APP_SOCIAL_FACEBOOK_URL }}
      VITE_APP_GITHUB_URL: ${{ secrets.VITE_APP_GITHUB_URL }}

  # acceptance_tests:
  #   name: Acceptance Tests (Tier 2 — pre-deploy gate)
  #   needs: [detect-changes, smoke_tests, build_push]
  #   if: |
  #     needs.smoke_tests.result == 'success' &&
  #     needs.build_push.result == 'success' &&
  #     (contains(fromJSON(needs.detect-changes.outputs.changes), 'java_api') || contains(fromJSON(needs.detect-changes.outputs.changes), 'frontend') || startsWith(github.ref, 'refs/tags/'))
  #   uses: ianoflynnautomation/bjjeire-tests/.github/workflows/acceptance.yml@main
  #   with:
  #     env_id: staging-${{ github.sha }}
  #     image_tag: ${{ github.sha }}
  #     cluster_resource_group: ${{ vars.AKS_RESOURCE_GROUP }}
  #     cluster_name: ${{ vars.AKS_CLUSTER_NAME }}
  #     cluster_domain: ${{ vars.CLUSTER_DOMAIN }}
  #     ttl: 4h
  #     test_repo: ianoflynnautomation/bjjeire-tests
  #     test_tags: '@acceptance'
  #     shard_total: 8
  #   secrets: inherit

  main_complete:
    name: Main Delivery Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - detect-changes
      - smoke_tests
      - java_build_test
      - generate_openapi_contract
      - generate_pact_contract
      - publish_contracts_ghcr
      - build_push
      # - acceptance_tests
    steps:
      - name: Verify all required main-branch jobs succeeded or were intentionally skipped
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/check-required-jobs@v1.1.0
        with:
          needs-json: ${{ toJson(needs) }}
          summary-title: Main delivery
