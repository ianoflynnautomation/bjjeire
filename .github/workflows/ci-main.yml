name: CI Main Delivery

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "logs/**"
      - ".gitattributes"
      - ".gitignore"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect_changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/detect-changes@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
        with:
          filters: .github/path-filters.yml

  java_build_test:
    name: Java Build & Test
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'java_api')
    permissions:
      contents: read
      checks: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/maven-build-test.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      working-directory: src/bjjeire-api
      java-version: "25"
      maven-goals: verify
      publish-test-report: true
      test-report-name: Java Test Results
      test-results-artifact-name: maven-test-results
      artifact-retention-days: 14

  generate_openapi_contract:
    name: Generate OpenAPI Contract
    runs-on: ubuntu-latest
    needs: detect_changes
    if: |
      contains(fromJSON(needs.detect_changes.outputs.changes), 'java_api') ||
      contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: src/bjjeire-api/pom.xml
      - name: Generate OpenAPI contract (springdoc)
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/maven-openapi-export@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
        with:
          working-directory: src/bjjeire-api
          it-test: OpenApiContractIT
          output-path: ${{ github.workspace }}/artifacts/contracts/openapi-v1.json
      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: main-openapi-contract
          path: artifacts/contracts/openapi-v1.json
          if-no-files-found: error
          retention-days: 30

  generate_pact_contract:
    name: Generate Pact Contract
    needs: detect_changes
    if: |
      contains(fromJSON(needs.detect_changes.outputs.changes), 'java_api') ||
      contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      job-name: Generate Pact Contract
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
      commands: |
        npm run test:pact
        test -s pacts/BjjEireWeb-BjjEireApi.json || { echo "::error title=Pact contract::pacts/BjjEireWeb-BjjEireApi.json was not generated"; exit 1; }
      artifact-name: main-pact-contract
      artifact-path: src/bjjeire-app/pacts/BjjEireWeb-BjjEireApi.json
      artifact-if-no-files-found: error
      artifact-retention-days: 30

  frontend_build_test:
    name: Frontend Unit & Integration
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      job-name: Frontend Unit & Integration
      working-directory: src/bjjeire-app
      container-image: node:26-bookworm-slim
      cache-key-prefix: bjjeire-app
      timeout-minutes: 20
      env-vars: |
        HUSKY=0
        SERVICES_API_HTTPS_0=https://api-ci-placeholder:443
      commands: |
        mkdir -p test-results
        npx vitest run --project unit --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-unit.xml
        npx vitest run --project integration --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-integration.xml
      artifact-name: frontend-test-results
      artifact-path: src/bjjeire-app/test-results/*.xml
      artifact-if-no-files-found: error
      upload-artifact-always: true
      artifact-retention-days: 14

  publish_contracts_ghcr:
    name: Publish Contracts to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [generate_openapi_contract, generate_pact_contract]
    timeout-minutes: 15
    env:
      OPENAPI_ARTIFACT_PATH: artifacts/contracts/openapi-v1.json
      PACT_ARTIFACT_PATH: artifacts/contracts/BjjEireWeb-BjjEireApi.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download contract artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: main-*-contract
          path: artifacts/contracts
          merge-multiple: true
      - name: Validate contract artifacts
        shell: bash
        run: |
          jq -e '.openapi and .paths' "$OPENAPI_ARTIFACT_PATH" > /dev/null
          jq -e '.consumer and .interactions' "$PACT_ARTIFACT_PATH" > /dev/null
          echo "::notice title=Contract validation::Both contract artifacts are structurally valid"
      - name: Gate — block publish on breaking changes
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/openapi-breaking-gate@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
        with:
          current-spec: ${{ env.OPENAPI_ARTIFACT_PATH }}
          image: ghcr.io/${{ github.repository_owner }}/bjjeire-openapi-contract
          token: ${{ github.token }}
          user: ${{ github.actor }}
      - name: Publish OpenAPI contract to GHCR
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/oci-push-artifact@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
        with:
          file: ${{ env.OPENAPI_ARTIFACT_PATH }}
          image: ghcr.io/${{ github.repository_owner }}/bjjeire-openapi-contract
          artifact-type: application/vnd.bjjeire.openapi.v1
          media-type: application/vnd.oai.openapi+json
          tags: |
            ${{ github.sha }}
            main
            latest
          password: ${{ github.token }}
          summary-title: Published OpenAPI contract
      - name: Publish Pact contract to GHCR
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/oci-push-artifact@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
        with:
          file: ${{ env.PACT_ARTIFACT_PATH }}
          image: ghcr.io/${{ github.repository_owner }}/bjjeire-web-pacts
          artifact-type: application/vnd.pact.consumer-contract
          media-type: application/vnd.pact.consumer-contract+json
          tags: |
            ${{ github.sha }}
            main
            latest
          password: ${{ github.token }}
          summary-title: Published Pact contract

  # Images are independent of contract publish. Gate on Java when it ran so a
  # red verify never ships; seeder/frontend-only changes skip Java and still build.
  build_push:
    name: Build & Push Images
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    needs: [detect_changes, java_build_test]
    if: |
      always() &&
      (needs.java_build_test.result == 'success' || needs.java_build_test.result == 'skipped') &&
      (
        contains(fromJSON(needs.detect_changes.outputs.changes), 'java_api_image') ||
        contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend') ||
        contains(fromJSON(needs.detect_changes.outputs.changes), 'seeder') ||
        startsWith(github.ref, 'refs/tags/')
      )
    uses: ./.github/workflows/build-push-ghcr.yml
    with:
      push_images: true
      changes: ${{ needs.detect_changes.outputs.changes }}
    secrets:
      VITE_APP_MSAL_CLIENT_ID: ${{ secrets.VITE_APP_MSAL_CLIENT_ID }}
      VITE_APP_MSAL_AUTHORITY: ${{ secrets.VITE_APP_MSAL_AUTHORITY }}
      VITE_APP_MSAL_API_SCOPE: ${{ secrets.VITE_APP_MSAL_API_SCOPE }}
      VITE_APP_CF_BEACON_TOKEN: ${{ secrets.VITE_APP_CF_BEACON_TOKEN }}
      VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
      VITE_APP_CONTACT_EMAIL: ${{ secrets.VITE_APP_CONTACT_EMAIL }}
      VITE_APP_SOCIAL_INSTAGRAM_URL: ${{ secrets.VITE_APP_SOCIAL_INSTAGRAM_URL }}
      VITE_APP_SOCIAL_FACEBOOK_URL: ${{ secrets.VITE_APP_SOCIAL_FACEBOOK_URL }}
      VITE_APP_GITHUB_URL: ${{ secrets.VITE_APP_GITHUB_URL }}

  # AKS ephemeral acceptance via Flux (Static InputProvider + HelmRelease wait).
  # Gated on ACCEPTANCE_AKS_ENABLED until the rebuilt dev cluster + ARC pool
  # are back. Compose @smoke lives on ci-pr.yml.
  acceptance_ephemeral:
    name: Acceptance Tests (AKS Ephemeral)
    needs: [detect_changes, build_push]
    if: |
      vars.ACCEPTANCE_AKS_ENABLED == 'true' &&
      needs.build_push.result == 'success' &&
      (contains(fromJSON(needs.detect_changes.outputs.changes), 'java_api_image') ||
       contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend') ||
       contains(fromJSON(needs.detect_changes.outputs.changes), 'seeder') ||
       startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      pages: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/acceptance-gate.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      mode: ephemeral
      env-id: sha-${{ github.run_id }}
      image-tag: ${{ github.sha }}
      cluster-resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
      cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
      cluster-domain: ${{ vars.AKS_CLUSTER_DOMAIN }}
      root-domain: ${{ vars.AKS_ROOT_DOMAIN != '' && vars.AKS_ROOT_DOMAIN || 'bjjeire.com' }}
      ttl: 4h
      test-repo: ianoflynnautomation/bjjeire-tests
      test-tags: '@acceptance'
      shard-total: 4
      project-shard-overrides: |
        api=2
        chromium-desktop=4
        firefox-desktop=1
        webkit-desktop=1
        snapshots=1
        a11y=1
        mobile-iphone=1
      playwright-projects: |
        api
        chromium-desktop
        firefox-desktop
        webkit-desktop
        snapshots
        a11y
        mobile-iphone
      keep-on-failure: true
      runs-on: gha-runner-scale-set
      report-runs-on: ubuntu-latest
      fail-on-flaky: true
      fail-fast: false
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      test-env-vars: |
        AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
        AZURE_TESTS_CLIENT_ID=${{ secrets.AZURE_TESTS_CLIENT_ID }}
        AZURE_TESTS_CLIENT_SECRET=${{ secrets.AZURE_TESTS_CLIENT_SECRET }}
        AZURE_API_SCOPE=${{ secrets.AZURE_API_SCOPE }}
        AZURE_AUTHORITY=${{ secrets.AZURE_AUTHORITY }}
        CF_ACCESS_CLIENT_ID=${{ secrets.CF_ACCESS_CLIENT_ID }}
        CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        PW_TEST_USER=${{ secrets.PW_TEST_USER }}
        PW_TEST_PASSWORD=${{ secrets.PW_TEST_PASSWORD }}

  promote_images:
    name: Promote SHA to Main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build_push, acceptance_ephemeral]
    if: |
      always() &&
      needs.build_push.result == 'success' &&
      (needs.acceptance_ephemeral.result == 'success' ||
       needs.acceptance_ephemeral.result == 'skipped')
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      SHA: ${{ github.sha }}
      API_DIGEST: ${{ needs.build_push.outputs.java_api_image_digest }}
      FRONTEND_DIGEST: ${{ needs.build_push.outputs.frontend_image_digest }}
      SEEDER_DIGEST: ${{ needs.build_push.outputs.seeder_image_digest }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Tag accepted digests as main
        shell: bash
        run: |
          set -euo pipefail
          promote() {
            local name="$1" digest="$2"
            local ref="${REGISTRY}/${OWNER}/${name}"
            if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
              echo "::notice title=Skip promote::${name} was not built this run"
              return 0
            fi
            docker buildx imagetools create --tag "${ref}:main" "${ref}@${digest}"
            echo "::notice title=Promoted::${ref}:main → ${digest}"
          }
          promote bjjeire-api "${API_DIGEST}"
          promote bjjeire-frontend "${FRONTEND_DIGEST}"
          promote bjjeire-seeder "${SEEDER_DIGEST}"

  package_java_reports:
    name: Package Java reports for main audit PDF
    needs: java_build_test
    if: always() && (needs.java_build_test.result == 'success' || needs.java_build_test.result == 'failure')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/package-test-report.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      download-artifact-name: maven-test-results
      download-artifact-pattern: ""
      source: java
      job-name: java_build_test
      skip-reason: Maven Surefire/Failsafe XML was not uploaded by java_build_test on the main delivery pipeline
      fail-if-empty: false
      artifact-retention-days: 14
      runs-on: ubuntu-latest
      packages: |
        unit|java|**/surefire-reports/*.xml
        integration|java|**/failsafe-reports/*.xml

  package_frontend_reports:
    name: Package frontend reports for main audit PDF
    needs: frontend_build_test
    if: always() && (needs.frontend_build_test.result == 'success' || needs.frontend_build_test.result == 'failure')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/package-test-report.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      download-artifact-name: frontend-test-results
      download-artifact-pattern: ""
      source: frontend
      job-name: frontend_build_test
      skip-reason: Vitest JUnit XML was not uploaded by frontend_build_test on the main delivery pipeline
      fail-if-empty: false
      artifact-retention-days: 14
      runs-on: ubuntu-latest
      packages: |
        unit|frontend|**/vitest-unit.xml
        integration|frontend|**/vitest-integration.xml

  package_acceptance_reports:
    name: Package AKS acceptance reports for main audit PDF
    needs: acceptance_ephemeral
    if: always() && (needs.acceptance_ephemeral.result == 'success' || needs.acceptance_ephemeral.result == 'failure')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/package-test-report.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      download-artifact-name: playwright-json-results
      download-artifact-pattern: ""
      source: acceptance
      job-name: acceptance_ephemeral
      skip-reason: Playwright JSON was not uploaded by acceptance_ephemeral on the main delivery pipeline
      fail-if-empty: false
      artifact-retention-days: 14
      runs-on: ubuntu-latest
      packages: |
        system|acceptance|**/*.json

  audit_report:
    name: Generate executive test report (main release pipeline)
    needs:
      - package_java_reports
      - package_frontend_reports
      - package_acceptance_reports
    if: always()
    permissions:
      contents: write
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/audit-report.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      product: BjjEire
      title: BjjEire Main Delivery — Audit-Ready Compliance Release Report
      environment: Main release pipeline
      required-categories: unit,integration,acceptance,system
      strict-missing: false
      fail-on-test-failure: true
      artifact-name: bjjeire-main-audit-release-report
      artifact-retention-days: 90
      download-pattern: report-*
      attach-to-tag: ""
      runs-on: ubuntu-latest

  main_complete:
    name: Main Delivery Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - detect_changes
      - java_build_test
      - generate_openapi_contract
      - generate_pact_contract
      - frontend_build_test
      - publish_contracts_ghcr
      - build_push
      - acceptance_ephemeral
      - promote_images
      - package_java_reports
      - package_frontend_reports
      - package_acceptance_reports
      - audit_report
    steps:
      - name: Verify all required main-branch jobs succeeded or were intentionally skipped
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/check-required-jobs@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
        with:
          needs-json: ${{ toJson(needs) }}
          summary-title: Main delivery
