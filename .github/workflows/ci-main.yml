name: CI Main Delivery

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "logs/**"
      - ".gitattributes"
      - ".gitignore"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REACT_APP_PATH: "src/bjjeire-app"

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      java-api: ${{ steps.changes.outputs.java_api }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/detect-changes

  smoke_tests:
    name: Acceptance Tests (Docker Compose)
    needs: detect-changes
    if: needs.detect-changes.outputs.java-api == 'true' || needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      pages: write
      checks: write
      pull-requests: write
    uses: ianoflynnautomation/bjjeire-tests/.github/workflows/playwright-docker.yml@main
    with:
      compose_files: |
          docker-compose.yml
          docker-compose.override.java-local.yml
          docker-compose.override.ci.yml
      compose_pre_up_script: .github/scripts/smoke-pre-up.sh
      seed_data: true
      compose_health_url: http://localhost:5003/health
      base_url: http://localhost:3000
      api_base_url: http://localhost:5003
      test_repo: ianoflynnautomation/bjjeire-tests
      test_tags: "@acceptance"
      playwright_projects: |
        api
        chromium-desktop
        firefox-desktop
        webkit-desktop
        chromium-wide
        snapshots
        a11y
        mobile-iphone
        mobile-galaxy
      project_shard_overrides: |
        api=3
        firefox-desktop=4
        webkit-desktop=3
        chromium-wide=3
        snapshots=1
        a11y=1
        mobile-iphone=1
        mobile-galaxy=1
      publish_report: true
      fail_on_flaky: false

  java_build_test:
    name: Java Build & Test
    needs: detect-changes
    if: needs.detect-changes.outputs.java-api == 'true'
    permissions:
      contents: read
      checks: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/maven-build-test.yml@main
    with:
      working-directory: src/bjjeire-api
      java-version: "25"
      maven-goals: verify
      publish-test-report: true
      test-report-name: Java Test Results

  generate_openapi_contract:
    name: Generate OpenAPI Contract
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.java-api == 'true' || needs.detect-changes.outputs.frontend == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: src/bjjeire-api/pom.xml
      - name: Generate OpenAPI contract (springdoc)
        uses: ./.github/actions/generate-openapi-contract
        with:
          output-path: ${{ github.workspace }}/artifacts/contracts/openapi-v1.json
      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: main-openapi-contract
          path: artifacts/contracts/openapi-v1.json
          if-no-files-found: error
          retention-days: 30

  generate_pact_contract:
    name: Generate Pact Contract
    runs-on: ubuntu-latest
    container:
      image: node:26-bookworm-slim
    needs: detect-changes
    if: needs.detect-changes.outputs.java-api == 'true' || needs.detect-changes.outputs.frontend == 'true'
    timeout-minutes: 15
    env:
      HUSKY: "0"
    defaults:
      run:
        working-directory: ${{ env.REACT_APP_PATH }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ianoflynnautomation/bjjeire-ci-templates/actions/setup-node-cached@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
        with:
          working-directory: ${{ env.REACT_APP_PATH }}
          install: 'true'
      - name: Generate frontend Pact contract
        shell: bash
        run: |
          echo "::group::npm run test:pact"
          npm run test:pact
          echo "::endgroup::"
          if ! test -s pacts/BjjEireWeb-BjjEireApi.json; then
            echo "::error title=Pact contract::pacts/BjjEireWeb-BjjEireApi.json was not generated"
            exit 1
          fi
          echo "::notice title=Pact contract::Generated $(wc -c < pacts/BjjEireWeb-BjjEireApi.json) bytes"
      - name: Upload Pact contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: main-pact-contract
          path: ${{ env.REACT_APP_PATH }}/pacts/BjjEireWeb-BjjEireApi.json
          if-no-files-found: error
          retention-days: 30

  publish_contracts_ghcr:
    name: Publish Contracts to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [smoke_tests, generate_openapi_contract, generate_pact_contract]
    timeout-minutes: 15
    env:
      OPENAPI_ARTIFACT_PATH: artifacts/contracts/openapi-v1.json
      PACT_ARTIFACT_PATH: artifacts/contracts/BjjEireWeb-BjjEireApi.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Download contract artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: main-*-contract
          path: artifacts/contracts
          merge-multiple: true
      - name: Validate contract artifacts
        shell: bash
        run: |
          jq -e '.openapi and .paths' "$OPENAPI_ARTIFACT_PATH" > /dev/null
          jq -e '.consumer and .interactions' "$PACT_ARTIFACT_PATH" > /dev/null
          echo "::notice title=Contract validation::Both contract artifacts are structurally valid"
      - name: Compute GHCR contract package names
        id: ghcr_names
        shell: bash
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner="${REPO_OWNER,,}"
          openapi="ghcr.io/${owner}/bjjeire-openapi-contract"
          pact="ghcr.io/${owner}/bjjeire-web-pacts"
          {
            echo "OPENAPI_IMAGE=${openapi}"
            echo "PACT_IMAGE=${pact}"
          } >> "$GITHUB_ENV"
          echo "::notice title=GHCR targets::openapi=${openapi} pact=${pact}"
      - name: Gate — block publish on breaking changes
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/openapi-breaking-gate@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
        with:
          current-spec: ${{ env.OPENAPI_ARTIFACT_PATH }}
          image: ghcr.io/${{ github.repository_owner }}/bjjeire-openapi-contract
          token: ${{ github.token }}
          user: ${{ github.actor }}
      - name: Login to GHCR with ORAS
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "::add-mask::${GHCR_TOKEN}"
          echo "::group::oras login ghcr.io"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io -u "$GHCR_USER" --password-stdin
          echo "::endgroup::"
      - name: Publish OpenAPI contract to GHCR
        id: push_openapi
        shell: bash
        run: |
          echo "::group::oras push (openapi)"
          openapi_dir="$(dirname "$OPENAPI_ARTIFACT_PATH")"
          openapi_file="$(basename "$OPENAPI_ARTIFACT_PATH")"
          cd "$openapi_dir"
          oras push "${OPENAPI_IMAGE}:${GITHUB_SHA}" \
            --artifact-type application/vnd.bjjeire.openapi.v1 \
            "${openapi_file}:application/vnd.oai.openapi+json"
          oras tag "${OPENAPI_IMAGE}:${GITHUB_SHA}" main latest
          echo "::endgroup::"
          echo "::notice title=OpenAPI published::${OPENAPI_IMAGE} tags=sha,main,latest"
      - name: Publish Pact contract to GHCR
        id: push_pact
        shell: bash
        run: |
          echo "::group::oras push (pact)"
          pact_dir="$(dirname "$PACT_ARTIFACT_PATH")"
          pact_file="$(basename "$PACT_ARTIFACT_PATH")"
          cd "$pact_dir"
          oras push "${PACT_IMAGE}:${GITHUB_SHA}" \
            --artifact-type application/vnd.pact.consumer-contract \
            "${pact_file}:application/vnd.pact.consumer-contract+json"
          oras tag "${PACT_IMAGE}:${GITHUB_SHA}" main latest
          echo "::endgroup::"
          echo "::notice title=Pact published::${PACT_IMAGE} tags=sha,main,latest"
      - name: Write contracts summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Published contracts"
            echo ""
            echo "| Contract | Image | Tags |"
            echo "| --- | --- | --- |"
            echo "| OpenAPI | \`${OPENAPI_IMAGE}\` | \`${GITHUB_SHA}\`, \`main\`, \`latest\` |"
            echo "| Pact (web → api) | \`${PACT_IMAGE}\` | \`${GITHUB_SHA}\`, \`main\`, \`latest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build_push:
    name: Build & Push Images
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    needs: [smoke_tests, publish_contracts_ghcr, java_build_test]
    if: |
      always() &&
      needs.smoke_tests.result == 'success' &&
      needs.publish_contracts_ghcr.result == 'success' &&
      (needs.java_build_test.result == 'success' || needs.java_build_test.result == 'skipped')
    uses: ./.github/workflows/build-push-ghcr.yml
    with:
      push_images: true
    secrets:
      VITE_APP_MSAL_CLIENT_ID: ${{ secrets.VITE_APP_MSAL_CLIENT_ID }}
      VITE_APP_MSAL_AUTHORITY: ${{ secrets.VITE_APP_MSAL_AUTHORITY }}
      VITE_APP_MSAL_API_SCOPE: ${{ secrets.VITE_APP_MSAL_API_SCOPE }}
      VITE_APP_CF_BEACON_TOKEN: ${{ secrets.VITE_APP_CF_BEACON_TOKEN }}
      VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
      VITE_APP_CONTACT_EMAIL: ${{ secrets.VITE_APP_CONTACT_EMAIL }}
      VITE_APP_SOCIAL_INSTAGRAM_URL: ${{ secrets.VITE_APP_SOCIAL_INSTAGRAM_URL }}
      VITE_APP_SOCIAL_FACEBOOK_URL: ${{ secrets.VITE_APP_SOCIAL_FACEBOOK_URL }}
      VITE_APP_GITHUB_URL: ${{ secrets.VITE_APP_GITHUB_URL }}

  # acceptance_tests:
  #   name: Acceptance Tests (Tier 2 — pre-deploy gate)
  #   needs: [detect-changes, smoke_tests, build_push]
  #   if: |
  #     needs.smoke_tests.result == 'success' &&
  #     needs.build_push.result == 'success' &&
  #     (needs.detect-changes.outputs.java-api == 'true' || needs.detect-changes.outputs.frontend == 'true' || startsWith(github.ref, 'refs/tags/'))
  #   uses: ianoflynnautomation/bjjeire-tests/.github/workflows/acceptance.yml@main
  #   with:
  #     env_id: staging-${{ github.sha }}
  #     image_tag: ${{ github.sha }}
  #     cluster_resource_group: ${{ vars.AKS_RESOURCE_GROUP }}
  #     cluster_name: ${{ vars.AKS_CLUSTER_NAME }}
  #     cluster_domain: ${{ vars.CLUSTER_DOMAIN }}
  #     ttl: 4h
  #     test_repo: ianoflynnautomation/bjjeire-tests
  #     test_tags: '@acceptance'
  #     shard_total: 8
  #   secrets: inherit

  main_complete:
    name: Main Delivery Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - detect-changes
      - smoke_tests
      - java_build_test
      - generate_openapi_contract
      - generate_pact_contract
      - publish_contracts_ghcr
      - build_push
      # - acceptance_tests
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/check-required-jobs
      - name: Verify all required main-branch jobs succeeded or were intentionally skipped
        uses: ./.github/actions/check-required-jobs
        with:
          needs-json: ${{ toJson(needs) }}
          summary-title: Main delivery

