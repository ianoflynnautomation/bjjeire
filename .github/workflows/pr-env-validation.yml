name: PR Env Validation

# Per-PR preview environment on AKS, owned by Flux.
#
# Lifecycle:
#   opened/synchronize/reopened
#     1. Build + push pr-<n>-<headsha> images (docker-build-push.yml)
#     2. Add label deploy-preview — ResourceSetInputProvider picks it up
#     3. Wait for HelmRelease bjj-eire in namespace pr-<n>
#     4. Run Playwright against the preview URLs
#   closed
#     Remove deploy-preview (Flux prunes) and delete the namespace as backup
#
# Gated on PR_ENV_ENABLED. Fork PRs are skipped (no secrets, no write labels).
#
# Required repo vars: PR_ENV_ENABLED, AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME,
# AKS_CLUSTER_DOMAIN.
# Required secrets: AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_SUBSCRIPTION_ID
# plus the Playwright test-env-vars set (Entra, CF Access, PW_TEST_*).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths-ignore:
      - "**.md"
      - "logs/**"
      - "docs/**"
      - ".gitattributes"
      - ".gitignore"

concurrency:
  group: pr-env-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read

env:
  IMAGE_TAG: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  PREVIEW_NS: pr-${{ github.event.pull_request.number }}

jobs:
  build-api:
    if: >
      vars.PR_ENV_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Build API image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/docker-build-push.yml@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
    with:
      image-name: bjjeire-api
      dockerfile: ./src/bjjeire-api/Dockerfile
      context: ./src/bjjeire-api
      push: true
      tags: |
        type=raw,value=pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cache-scope: bjjeire-api-pr
      labels: |
        org.opencontainers.image.title=bjjeire-api

  build-frontend:
    if: >
      vars.PR_ENV_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Build frontend image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/docker-build-push.yml@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
    with:
      image-name: bjjeire-frontend
      dockerfile: ./src/bjjeire-app/Dockerfile
      push: true
      tags: |
        type=raw,value=pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cache-scope: bjjeire-frontend-pr
      labels: |
        org.opencontainers.image.title=bjjeire-frontend
    secrets:
      SECRET_BUILD_ARGS: |
        VITE_APP_MSAL_CLIENT_ID=${{ secrets.VITE_APP_MSAL_CLIENT_ID }}
        VITE_APP_MSAL_AUTHORITY=${{ secrets.VITE_APP_MSAL_AUTHORITY }}
        VITE_APP_MSAL_API_SCOPE=${{ secrets.VITE_APP_MSAL_API_SCOPE }}
        VITE_APP_CF_BEACON_TOKEN=${{ secrets.VITE_APP_CF_BEACON_TOKEN }}
        VITE_APP_APP_URL=${{ secrets.VITE_APP_URL }}
        VITE_APP_CONTACT_EMAIL=${{ secrets.VITE_APP_CONTACT_EMAIL }}
        VITE_APP_SOCIAL_INSTAGRAM_URL=${{ secrets.VITE_APP_SOCIAL_INSTAGRAM_URL }}
        VITE_APP_SOCIAL_FACEBOOK_URL=${{ secrets.VITE_APP_SOCIAL_FACEBOOK_URL }}
        VITE_APP_GITHUB_URL=${{ secrets.VITE_APP_GITHUB_URL }}

  build-seeder:
    if: >
      vars.PR_ENV_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Build seeder image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/docker-build-push.yml@26e45d2ba093606c068491a8adfdcbcb768309e8  # main
    with:
      image-name: bjjeire-seeder
      dockerfile: ./src/bjjeire-api/seeder.Dockerfile
      context: .
      push: true
      tags: |
        type=raw,value=pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cache-scope: bjjeire-seeder-pr
      labels: |
        org.opencontainers.image.title=bjjeire-seeder

  label-preview:
    if: >
      vars.PR_ENV_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Label deploy-preview
    needs: [build-api, build-frontend, build-seeder]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Ensure label and apply it
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const label = 'deploy-preview'
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              })
            } catch (err) {
              if (err.status !== 404) throw err
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: '0e8a16',
                description: 'Flux preview environment for this PR',
              })
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            })
            core.notice(`Labeled #${context.issue.number} ${label}`)

  wait-ready:
    if: >
      vars.PR_ENV_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Wait for Flux preview
    needs: [label-preview]
    runs-on: gha-runner-scale-set
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      base_url: ${{ steps.wait.outputs.base-url }}
      api_base_url: ${{ steps.wait.outputs.api-url }}
      internal_api_url: ${{ steps.wait.outputs.internal-api-url }}
      namespace: ${{ steps.wait.outputs.namespace }}
    steps:
      - name: Log in to AKS
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/azure-aks-login@e5a0f9590443cd2705b9da764d6a9c3571cc8700  # v1.4.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          install-helm: "false"

      - name: Wait until HelmRelease exists
        env:
          NS: ${{ env.PREVIEW_NS }}
        run: |
          set -euo pipefail
          echo "::group::Waiting for helmrelease/bjj-eire in ${NS}"
          for _ in $(seq 1 60); do
            if kubectl -n "${NS}" get helmrelease bjj-eire >/dev/null 2>&1; then
              echo "  present"
              echo "::endgroup::"
              exit 0
            fi
            sleep 5
          done
          echo "::endgroup::"
          echo "::error title=Preview not created::HelmRelease bjj-eire did not appear in ${NS} within 5m — check ResourceSetInputProvider bjj-eire-prs and the deploy-preview label"
          exit 1

      - name: Wait for HelmRelease Ready
        id: wait
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/flux-wait-helmrelease@e5a0f9590443cd2705b9da764d6a9c3571cc8700  # v1.4.2
        with:
          namespace: ${{ env.PREVIEW_NS }}
          name: bjj-eire
          timeout: 10m
          cluster-domain: ${{ vars.AKS_ROOT_DOMAIN != '' && vars.AKS_ROOT_DOMAIN || 'bjjeire.com' }}
          env-id: ${{ env.PREVIEW_NS }}

      - name: Collect diagnostics
        if: failure()
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/collect-k8s-diagnostics@e5a0f9590443cd2705b9da764d6a9c3571cc8700  # v1.4.2
        with:
          namespace: ${{ env.PREVIEW_NS }}
          helm-release: bjj-eire
          flux-helmrelease: bjj-eire
          upload-artifact: "true"
          artifact-name: k8s-diagnostics-${{ env.PREVIEW_NS }}

  acceptance:
    if: >
      vars.PR_ENV_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Acceptance tests
    needs: [wait-ready]
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      pages: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/playwright-tests.yml@cf8cd586a13d524028cdf41c72c2f502ac246722  # v1.2.0
    with:
      app-env: staging
      base-url: ${{ needs.wait-ready.outputs.base_url }}
      api-url: ${{ needs.wait-ready.outputs.api_base_url }}
      test-repo: ianoflynnautomation/bjjeire-tests
      test-tags: "@smoke|@acceptance"
      shard-total: 4
      playwright-projects: |
        api
        chromium-desktop
        firefox-desktop
        webkit-desktop
      config-map: |
        api=playwright.api.config.ts
      default-config: playwright.ui.config.ts
      project-env-overrides: |
        api:API_URL=${{ needs.wait-ready.outputs.internal_api_url }}
        api:CF_ACCESS_REQUIRED=false
        api:CF_ACCESS_CLIENT_ID=
        api:CF_ACCESS_CLIENT_SECRET=
      runs-on: gha-runner-scale-set
      report-runs-on: ubuntu-latest
    secrets:
      test-env-vars: |
        AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
        AZURE_TESTS_CLIENT_ID=${{ secrets.AZURE_TESTS_CLIENT_ID }}
        AZURE_TESTS_CLIENT_SECRET=${{ secrets.AZURE_TESTS_CLIENT_SECRET }}
        AZURE_API_SCOPE=${{ secrets.AZURE_API_SCOPE }}
        AZURE_AUTHORITY=${{ secrets.AZURE_AUTHORITY }}
        CF_ACCESS_CLIENT_ID=${{ secrets.CF_ACCESS_CLIENT_ID }}
        CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        PW_TEST_USER=${{ secrets.PW_TEST_USER }}
        PW_TEST_PASSWORD=${{ secrets.PW_TEST_PASSWORD }}

  pr-comment:
    if: >
      vars.PR_ENV_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      always()
    name: Post PR env link
    needs: [wait-ready, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Compose PR env comment
        id: comment_body
        shell: bash
        env:
          BASE_URL: ${{ needs.wait-ready.outputs.base_url }}
          API_URL: ${{ needs.wait-ready.outputs.api_base_url }}
          DEPLOY_RESULT: ${{ needs.wait-ready.result }}
          TEST_RESULT: ${{ needs.acceptance.result }}
        run: |
          set -euo pipefail
          DEPLOY="${DEPLOY_RESULT:-unknown}"
          TESTS="${TEST_RESULT:-unknown}"
          if [ "$DEPLOY" = "success" ] && [ "$TESTS" = "success" ]; then
            STATUS=PASS
          else
            STATUS=FAIL
          fi
          DELIM="body_$(date +%s%N)"
          {
            echo "body<<${DELIM}"
            echo "## PR env: ${STATUS}"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Flux preview | \`${DEPLOY}\` |"
            echo "| Acceptance | \`${TESTS}\` |"
            echo ""
            echo "Frontend: ${BASE_URL:-(not deployed)}"
            echo "API: ${API_URL:-(not deployed)}"
            echo ""
            echo "_Reaped when this PR closes or after the janitor TTL (2h)._"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Post PR env link
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/sticky-comment@v1.3.0
        with:
          marker: "<!-- pr-env-validation -->"
          body: ${{ steps.comment_body.outputs.body }}
          issue-number: ${{ github.event.pull_request.number }}
          summary-title: PR environment

  unlabel-preview:
    if: >
      vars.PR_ENV_ENABLED == 'true' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Remove deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'deploy-preview',
              })
            } catch (err) {
              if (err.status !== 404) throw err
              core.notice('deploy-preview already absent')
            }

  destroy-env:
    if: >
      vars.PR_ENV_ENABLED == 'true' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Destroy pr-${{ github.event.pull_request.number }}
    needs: [unlabel-preview]
    permissions:
      contents: read
      id-token: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/flux-ephemeral-teardown.yml@e5a0f9590443cd2705b9da764d6a9c3571cc8700  # v1.4.2
    with:
      env-id: pr-${{ github.event.pull_request.number }}
      cluster-resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
      cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
      helm-release: bjj-eire
      flux-helmrelease: bjj-eire
      runs-on: gha-runner-scale-set
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
