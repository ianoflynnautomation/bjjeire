name: PR Env Validation

# Per-PR ephemeral environment + acceptance tests on AKS (Tier 2).
#
# Lifecycle:
#   - opened/synchronize/reopened → build PR images, deploy to pr-N namespace,
#     run sharded Playwright suite against pr-N.<cluster domain>
#   - closed                      → destroy pr-N namespace (TTL janitor is the
#                                   safety net if this is skipped)
#
# Rollout switch: every job is gated on the PR_ENV_ENABLED repo variable so
# this workflow stays inert until the dev cluster + ARC runners exist. Set
# PR_ENV_ENABLED=true (Actions → Variables) to turn it on. Run alongside the
# Docker-Compose smoke_tests in ci-main.yml until trusted, then decide overlap.
#
# Required repo secrets:
#   AZURE_TENANT_ID         — Entra tenant
#   AZURE_CLIENT_ID         — uami-gha-prenv-* client ID (output of identity.tf)
#   AZURE_SUBSCRIPTION_ID   — subscription containing the AKS cluster
#
# Required repo vars (Actions → Variables, not Secrets):
#   PR_ENV_ENABLED          — 'true' to activate this workflow
#   AKS_RESOURCE_GROUP      — e.g. rg-bjjeire-dev-swn-01
#   AKS_CLUSTER_NAME        — e.g. aks-bjjeire-dev-swn-01
#   AKS_CLUSTER_DOMAIN      — e.g. dev.bjjeire.com

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths-ignore:
      - "**.md"
      - "logs/**"
      - "docs/**"
      - ".gitattributes"
      - ".gitignore"

concurrency:
  group: pr-env-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read
  id-token: write
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/bjjeire-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/bjjeire-frontend
  SEEDER_IMAGE: ghcr.io/${{ github.repository_owner }}/bjjeire-seeder
  IMAGE_TAG: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

jobs:
  build-images:
    if: vars.PR_ENV_ENABLED == 'true' && github.event.action != 'closed'
    name: Build & push PR images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build & push API
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./src/bjjeire-api
          file: ./src/bjjeire-api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: |
            type=gha,scope=api-${{ github.ref_name }}
            type=gha,scope=api-main
          cache-to: type=gha,scope=api-${{ github.ref_name }},mode=max

      - name: Build & push Frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./src/bjjeire-app/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: |
            type=gha,scope=frontend-${{ github.ref_name }}
            type=gha,scope=frontend-main
          cache-to: type=gha,scope=frontend-${{ github.ref_name }},mode=max

      - name: Build & push Seeder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./src/bjjeire-api/seeder.Dockerfile
          push: true
          tags: ${{ env.SEEDER_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: |
            type=gha,scope=seeder-${{ github.ref_name }}
            type=gha,scope=seeder-main
          cache-to: type=gha,scope=seeder-${{ github.ref_name }},mode=max

  deploy-env:
    if: vars.PR_ENV_ENABLED == 'true' && github.event.action != 'closed'
    name: Deploy pr-${{ github.event.pull_request.number }}
    needs: [build-images]
    uses: ianoflynnautomation/bjjeire-tests/.github/workflows/pr-env.yml@main
    with:
      action: deploy
      pr_number: ${{ github.event.pull_request.number }}
      image_tag: ${{ needs.build-images.outputs.image_tag }}
      cluster_resource_group: ${{ vars.AKS_RESOURCE_GROUP }}
      cluster_name: ${{ vars.AKS_CLUSTER_NAME }}
      cluster_domain: ${{ vars.AKS_CLUSTER_DOMAIN }}
    secrets: inherit

  acceptance:
    if: vars.PR_ENV_ENABLED == 'true' && github.event.action != 'closed'
    name: Acceptance tests
    needs: [deploy-env]
    permissions:
      contents: read
      actions: read
      checks: write
      packages: read
      id-token: write
      pages: write
    uses: ianoflynnautomation/bjjeire-tests/.github/workflows/playwright-tests.yml@main
    with:
      app_env: staging
      base_url: ${{ needs.deploy-env.outputs.base_url }}
      api_base_url: ${{ needs.deploy-env.outputs.api_base_url }}
      internal_api_url: ${{ needs.deploy-env.outputs.internal_api_url }}
      test_repo: ianoflynnautomation/bjjeire-tests
      test_tags: "@smoke|@acceptance"
      shard_total: 4
      playwright_projects: '["api","chromium-desktop","firefox-desktop","webkit-desktop"]'
    secrets: inherit

  pr-comment:
    if: vars.PR_ENV_ENABLED == 'true' && github.event.action != 'closed' && always()
    name: Post PR env link
    needs: [deploy-env, acceptance]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Compose PR env comment
        id: comment_body
        shell: bash
        env:
          BASE_URL: ${{ needs.deploy-env.outputs.base_url }}
          API_URL: ${{ needs.deploy-env.outputs.api_base_url }}
          DEPLOY_RESULT: ${{ needs.deploy-env.result }}
          TEST_RESULT: ${{ needs.acceptance.result }}
        run: |
          set -euo pipefail
          DEPLOY="${DEPLOY_RESULT:-unknown}"
          TESTS="${TEST_RESULT:-unknown}"
          if [ "$DEPLOY" = "success" ] && [ "$TESTS" = "success" ]; then
            STATUS=PASS
          else
            STATUS=FAIL
          fi
          DELIM="body_$(date +%s%N)"
          {
            echo "body<<${DELIM}"
            echo "## PR env: ${STATUS}"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Deploy | \`${DEPLOY}\` |"
            echo "| Acceptance | \`${TESTS}\` |"
            echo ""
            echo "Frontend: ${BASE_URL:-(not deployed)}"
            echo "API: ${API_URL:-(not deployed)}"
            echo ""
            echo "_Environment is reaped automatically when this PR closes (or after 2h)._"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Post PR env link
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/sticky-comment@v1.1.0
        with:
          marker: "<!-- pr-env-validation -->"
          body: ${{ steps.comment_body.outputs.body }}
          issue-number: ${{ github.event.pull_request.number }}
          summary-title: PR environment

  destroy-env:
    if: vars.PR_ENV_ENABLED == 'true' && github.event.action == 'closed'
    name: Destroy pr-${{ github.event.pull_request.number }}
    uses: ianoflynnautomation/bjjeire-tests/.github/workflows/pr-env.yml@main
    with:
      action: destroy
      pr_number: ${{ github.event.pull_request.number }}
      cluster_resource_group: ${{ vars.AKS_RESOURCE_GROUP }}
      cluster_name: ${{ vars.AKS_CLUSTER_NAME }}
      cluster_domain: ${{ vars.AKS_CLUSTER_DOMAIN }}
    secrets: inherit
