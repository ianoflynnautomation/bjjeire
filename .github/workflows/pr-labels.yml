name: Pull Request Labels

# When labels change:
# - Open, push, or reopen: upsert the label catalog, sync area labels from
#   the files in the diff, then set the type label from the title.
# - Edit the title: set the type label again. Area labels stay as they are.
# - Edit only the body: upsert the catalog only. The pull request's labels
#   stay as they are.
#
# Area labels come from .github/labeler.yml. They are added and removed so
# the pull request matches the files it currently changes. A hand-added area
# label is removed when those files are no longer in the diff.
# Type labels come from a conventional commit title. The body is never read.
# A title with no known prefix loses its type label. It does not get a guess.
# Any other label (for example run-smoke, deploy-preview, community-submission,
# or type:gym) is left alone.
# Branch names are not used. feature/ does not mean type/feature.
#
# pull_request, not pull_request_target: the workflow and the label config
# are the ones in this pull request. Fork pull requests are skipped so a
# read-only fork token is never asked to write labels.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ensure_labels:
    name: Ensure Labels
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/sync-labels.yml@513f5c1c68f1cacda89d32f36167f9187b218366  # v1.6.2
    with:
      labels-file: .github/labels.yml

  area_labels:
    name: Area Labels
    needs: ensure_labels
    if: >-
      needs.ensure_labels.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Label from changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
        with:
          sync-labels: true
          configuration-path: .github/labeler.yml

  type_label:
    name: Type Label
    needs: [ensure_labels, area_labels]
    if: >-
      !cancelled() &&
      needs.ensure_labels.result == 'success' &&
      (needs.area_labels.result == 'success' || needs.area_labels.result == 'skipped') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.title)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label from the pull request title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title;
            const match = /^(feat|fix|chore|docs|refactor|test|perf|ci|build|style)(\([^)]+\))?(!)?:/i.exec(
              title,
            );
            const byPrefix = {
              feat: "type/feature",
              fix: "type/fix",
              chore: "type/chore",
              ci: "type/chore",
              build: "type/chore",
              style: "type/chore",
              docs: "type/docs",
              refactor: "type/refactor",
              test: "type/test",
              perf: "type/perf",
            };
            const managed = [...new Set(Object.values(byPrefix)), "breaking"];
            const wanted = new Set();
            if (match) {
              wanted.add(byPrefix[match[1].toLowerCase()]);
              if (match[3] === "!") wanted.add("breaking");
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const current = new Set(
              context.payload.pull_request.labels.map((label) => label.name),
            );
            for (const name of managed) {
              if (wanted.has(name) && !current.has(name)) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [name],
                });
              } else if (!wanted.has(name) && current.has(name)) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name,
                });
              }
            }
