name: Acceptance Staging

# Runs the same Playwright suite against the long-lived staging environment.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: acceptance-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refuse_production_hosts:
    name: Refuse Production Hosts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check staging URLs
        env:
          BASE: ${{ vars.STAGING_BASE_URL }}
          API: ${{ vars.STAGING_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || [ -z "${API}" ]; then
            echo "::error title=Missing vars::Set STAGING_BASE_URL and STAGING_API_URL"
            exit 1
          fi
          allow='^https://([a-z0-9-]+\.)*staging\.|^https://([a-z0-9-]+\.)*dev\.'
          for url in "${BASE}" "${API}"; do
            host="${url#https://}"
            host="${host#http://}"
            host="${host%%/*}"
            case "${host}" in
              bjjeire.com|www.bjjeire.com|api.bjjeire.com)
                echo "::error title=Refusing production::${url} is a production host"
                exit 1
                ;;
            esac
            if ! printf '%s\n' "${url}" | grep -Eq "${allow}"; then
              echo "::error title=Unrecognised staging host::${url} is not under staging.* or *.dev.*"
              exit 1
            fi
          done
          echo "::notice title=Staging targets::frontend=${BASE} api=${API}"

  test_acceptance_staging:
    name: Acceptance Tests (Staging)
    needs: [refuse_production_hosts]
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      pages: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/acceptance-gate.yml@2162415849bfd26a2a9284487c21425626e088a8  # v1.6.0
    with:
      mode: existing
      base-url: ${{ vars.STAGING_BASE_URL }}
      api-url: ${{ vars.STAGING_API_URL }}
      test-tags: "@acceptance"
      fail-on-flaky: true
      fail-fast: false
      publish-report: true
      runs-on: gha-runner-scale-set
      report-runs-on: ubuntu-latest
      shard-total: 4
      project-shard-overrides: |
        api=2
        chromium-desktop=4
        firefox-desktop=1
        webkit-desktop=1
        chromium-wide=1
        snapshots=1
        a11y=1
        mobile-iphone=1
        mobile-galaxy=1
      playwright-projects: |
        api
        chromium-desktop
        firefox-desktop
        webkit-desktop
        chromium-wide
        snapshots
        a11y
        mobile-iphone
        mobile-galaxy
    secrets:
      test-env-vars: |
        AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
        AZURE_TESTS_CLIENT_ID=${{ secrets.AZURE_TESTS_CLIENT_ID }}
        AZURE_TESTS_CLIENT_SECRET=${{ secrets.AZURE_TESTS_CLIENT_SECRET }}
        AZURE_API_SCOPE=${{ secrets.AZURE_API_SCOPE }}
        AZURE_AUTHORITY=${{ secrets.AZURE_AUTHORITY }}
        CF_ACCESS_CLIENT_ID=${{ secrets.CF_ACCESS_CLIENT_ID }}
        CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        PW_TEST_USER=${{ secrets.PW_TEST_USER }}
        PW_TEST_PASSWORD=${{ secrets.PW_TEST_PASSWORD }}
