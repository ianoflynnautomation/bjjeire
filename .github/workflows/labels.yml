name: Sync Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be upserted without calling the API"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-labels
  cancel-in-progress: false

jobs:
  sync_labels:
    name: Sync Labels
    permissions:
      contents: read
      issues: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/sync-labels.yml@f51b5ef3b6c34b56452d6bec29337e9d4240b078  # v1.3.0
    with:
      labels-file: .github/labels.yml
      dry-run: ${{ inputs.dry_run || false }}
