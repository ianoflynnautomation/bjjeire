version: 2
updates:
  - package-ecosystem: maven
    directory: /src/bjjeire-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - area/backend
      - area/dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      spring:
        patterns:
          - "org.springframework*"
      opentelemetry:
        patterns:
          - "io.opentelemetry*"
      testing:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.testcontainers*"
          - "org.assertj*"
    ignore:
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /src/bjjeire-app
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 10
    labels:
      - area/frontend
      - area/dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      tanstack:
        patterns:
          - "@tanstack/*"
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"
      testing:
        patterns:
          - "vitest*"
          - "@testing-library/*"
          - "@vitest/*"

  # Composite actions now live in bjjeire-ci-templates, which runs its own
  # Dependabot over them — only this repo's workflows need scanning here.
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
      day: wednesday
    labels:
      - area/ci
    commit-message:
      prefix: ci
    ignore:
      # Held on v1.6.2 in ci-pr.yml: v1.8.0's actionlint step fails posting reviewdog's check run (404).
      # Remove once a bjjeire-ci-templates release fixes it.
      - dependency-name: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/lint-workflows.yml

  - package-ecosystem: docker
    directory: /src/bjjeire-api
    schedule:
      interval: weekly
      day: thursday
    labels:
      - area/backend
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directory: /src/bjjeire-app
    schedule:
      interval: weekly
      day: thursday
    labels:
      - area/frontend
    commit-message:
      prefix: chore
