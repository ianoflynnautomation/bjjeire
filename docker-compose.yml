x-defaults: &default-service
  platform: linux/arm64
  restart: unless-stopped
  networks:
    - bjj-network
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 512M
      reservations:
        cpus: '0.25'
        memory: 256M

x-healthcheck-curl: &healthcheck-curl
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

services:
  api:
    <<: *default-service
    profiles: ["app"]
    container_name: api
    ports:
      - "5003:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-production}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - MONGODB_URI=mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-password}@${MONGODB_HOST:-mongodb}:${MONGODB_PORT:-27017}/${MONGODB_DB:-Mongodb}?authSource=admin&authMechanism=SCRAM-SHA-256
      - MONGODB_DATABASE=${MONGODB_DB:-Mongodb}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN}
      - READ_ONLY_MODE_ENABLED=${READ_ONLY_MODE_ENABLED:-true}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_PERMIT_LIMIT=${RATE_LIMIT_PERMIT_LIMIT:-600}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - RATE_LIMIT_TRUSTED_PROXIES=${RATE_LIMIT_TRUSTED_PROXIES:-}
      - ENTRA_ISSUER_URI=${ENTRA_ISSUER_URI}
      - ENTRA_AUDIENCE=${ENTRA_AUDIENCE}
      - ENTRA_AUDIENCE_URI=${ENTRA_AUDIENCE_URI:-}
      # Placeholders until the external tenant and Stripe account exist (specs/001-tournament-registration).
      - COMPETITOR_ISSUER_URI=${COMPETITOR_ISSUER_URI:-https://00000000-0000-0000-0000-000000000000.ciamlogin.com/00000000-0000-0000-0000-000000000000/v2.0}
      - COMPETITOR_AUDIENCE=${COMPETITOR_AUDIENCE:-api://00000000-0000-0000-0000-000000000000}
      # Research R11: Graph credentials that delete a competitor's sign-in. Blank: the API refuses the
      # deleted account's tokens and the identity is removed from the tenant by hand.
      - COMPETITOR_DIRECTORY_TENANT_ID=${COMPETITOR_DIRECTORY_TENANT_ID:-}
      - COMPETITOR_DIRECTORY_CLIENT_ID=${COMPETITOR_DIRECTORY_CLIENT_ID:-}
      - COMPETITOR_DIRECTORY_CLIENT_SECRET=${COMPETITOR_DIRECTORY_CLIENT_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_REPLACE_ME}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_REPLACE_ME}
      - STRIPE_SHOP_WEBHOOK_SECRET=${STRIPE_SHOP_WEBHOOK_SECRET:-whsec_REPLACE_ME}
      - STRIPE_SUCCESS_URL_BASE=${STRIPE_SUCCESS_URL_BASE:-https://bjjeire.com}
      # Research R6: blank SPRING_MAIL_HOST means sign-up mail is logged, not sent.
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-no-reply@bjjeire.com}
      - FEATURE_BJJEIRE_COMPETITIONS=${FEATURE_BJJEIRE_COMPETITIONS:-false}
      - FEATURE_MERCH=${FEATURE_MERCH:-false}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-bjjeire-api}
      - OTEL_RESOURCE_ATTRIBUTES=service.name=${OTEL_SERVICE_NAME:-bjjeire-api},deployment.environment=${SPRING_PROFILES_ACTIVE:-production}
    volumes:
      - ./logs:/app/logs
    secrets:
      - mongodb_password
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-curl
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  frontend:
    <<: *default-service
    profiles: ["app"]
    container_name: web
    ports:
      - "3000:80"
    environment:
      - PORT=${PORT:-80}
      - SERVICES_API_HTTP_0=${SERVICES_API_HTTP_0:-http://api:8080}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-curl
      test: ["CMD", "curl", "-f", "http://localhost/health"]

  mongodb:
    <<: *default-service
    profiles: ["app"]
    image: mongo:8.2
    container_name: mongodb
    # Single-node replica set rs0 (ADR-0017): the API writes event publications in transactions. The healthcheck
    # initiates the set and reports healthy once this node is the writable primary.
    entrypoint: ["bash", "/opt/bjjeire/mongodb/replica-set-entrypoint.sh"]
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - ./tools/mongodb:/opt/bjjeire/mongodb:ro
    secrets:
      - mongodb_password
    healthcheck:
      test: ["CMD", "bash", "/opt/bjjeire/mongodb/replica-set-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:

secrets:
  mongodb_password:
    file: ./secrets/mongodb_password.txt

networks:
  bjj-network:
    driver: bridge
