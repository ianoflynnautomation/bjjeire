spring:
  application:
    name: BjjEire.JavaApi
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: ${MONGODB_DATABASE:BjjEire}
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI:https://login.microsoftonline.com/REPLACE_WITH_YOUR_TENANT_ID/v2.0}
          audiences:
            - ${ENTRA_AUDIENCE:api://REPLACE_WITH_YOUR_CLIENT_ID}
            - ${ENTRA_AUDIENCE_URI:${ENTRA_AUDIENCE:api://REPLACE_WITH_YOUR_CLIENT_ID}}

server:
  port: ${SERVER_PORT:${PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

bjjeire:
  auth:
    writer-scope: ${BJJ_EIRE_WRITER_SCOPE:access_as_writer}
  # Tournament registration (specs/001-tournament-registration, ADR-0012, ADR-0013). The all-zero
  # tenant and the REPLACE_ME keys are placeholders. competitor-auth is read by SecurityConfig;
  # stripe is not read until sign-up is built.
  competitor-auth:
    issuer-uri: ${COMPETITOR_ISSUER_URI:https://00000000-0000-0000-0000-000000000000.ciamlogin.com/00000000-0000-0000-0000-000000000000/v2.0}
    audiences:
      - ${COMPETITOR_AUDIENCE:api://00000000-0000-0000-0000-000000000000}
      - ${COMPETITOR_AUDIENCE_URI:${COMPETITOR_AUDIENCE:api://00000000-0000-0000-0000-000000000000}}
    scope: ${COMPETITOR_SCOPE:access_as_competitor}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_REPLACE_ME}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_REPLACE_ME}
  # ADR-0014: organiser sign-in without Entra, for local development only. The API refuses to start with
  # this on unless the 'local' profile is active. docker-compose.override.java-local.yml turns it on.
  local-sign-in:
    enabled: ${LOCAL_SIGN_IN_ENABLED:false}
    secret: ${LOCAL_SIGN_IN_SECRET:}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:https://bjjeire.com}
  donation:
    bitcoin-address: ${DONATION_BITCOIN_ADDRESS:${Donation__BitcoinAddress:REPLACE_WITH_OFFICIAL_ADDRESS}}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:${RateLimitOptions__EnableRateLimiting:true}}
    permit-limit: ${RATE_LIMIT_PERMIT_LIMIT:${RateLimitOptions__PermitLimit:600}}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:${RateLimitOptions__WindowInSeconds:60}}
    rejection-status-code: ${RATE_LIMIT_REJECTION_STATUS_CODE:${RateLimitOptions__RejectionStatusCode:429}}
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
  read-only-mode:
    enabled: ${READ_ONLY_MODE_ENABLED:${ReadOnlyMode__Enabled:true}}
  feature-flags:
    BjjEvents: ${FEATURE_BJJ_EVENTS:true}
    Gyms: ${FEATURE_GYMS:true}
    Competitions: ${FEATURE_COMPETITIONS:true}
    Stores: ${FEATURE_STORES:true}
    Tournaments: ${FEATURE_TOURNAMENTS:false}
    GymsMap: ${FEATURE_GYMS_MAP:false}
    EventsMap: ${FEATURE_EVENTS_MAP:false}
