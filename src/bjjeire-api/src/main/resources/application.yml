spring:
  application:
    name: BjjEire.JavaApi
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: ${MONGODB_DATABASE:BjjEire}
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI:https://login.microsoftonline.com/REPLACE_WITH_YOUR_TENANT_ID/v2.0}
          audiences:
            - ${ENTRA_AUDIENCE:api://REPLACE_WITH_YOUR_CLIENT_ID}
            - ${ENTRA_AUDIENCE_URI:${ENTRA_AUDIENCE:api://REPLACE_WITH_YOUR_CLIENT_ID}}

server:
  port: ${SERVER_PORT:${PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

bjjeire:
  auth:
    writer-scope: ${BJJ_EIRE_WRITER_SCOPE:access_as_writer}
  # BJJ Éire competition registration (specs/001-tournament-registration, ADR-0012, ADR-0013). The all-zero
  # tenant and the REPLACE_ME keys are placeholders. competitor-auth is read by SecurityConfig;
  # stripe, mail and registration by the registration package.
  competitor-auth:
    issuer-uri: ${COMPETITOR_ISSUER_URI:https://00000000-0000-0000-0000-000000000000.ciamlogin.com/00000000-0000-0000-0000-000000000000/v2.0}
    audiences:
      - ${COMPETITOR_AUDIENCE:api://00000000-0000-0000-0000-000000000000}
      - ${COMPETITOR_AUDIENCE_URI:${COMPETITOR_AUDIENCE:api://00000000-0000-0000-0000-000000000000}}
    scope: ${COMPETITOR_SCOPE:access_as_competitor}
  # Research R11: Microsoft Graph credentials in the competitor tenant, used only to delete a competitor's
  # sign-in when they delete their account. Blank means not configured: the API then refuses that account's
  # tokens and logs that the identity must be removed from the tenant by hand.
  competitor-directory:
    tenant-id: ${COMPETITOR_DIRECTORY_TENANT_ID:}
    client-id: ${COMPETITOR_DIRECTORY_CLIENT_ID:}
    client-secret: ${COMPETITOR_DIRECTORY_CLIENT_SECRET:}
    # AKS workload identity: used when no client secret is set.
    federated-token-file: ${COMPETITOR_DIRECTORY_FEDERATED_TOKEN_FILE:}
    authority-host: ${COMPETITOR_DIRECTORY_AUTHORITY_HOST:https://login.microsoftonline.com/}
    graph-base-url: ${COMPETITOR_DIRECTORY_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_REPLACE_ME}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_REPLACE_ME}
    # The site's origin: Checkout returns the competitor to /competitions/<slug>/signup[/complete] under it.
    success-url-base: ${STRIPE_SUCCESS_URL_BASE:https://bjjeire.com}
  # Research R6. The SMTP server is Spring Boot's spring.mail.* (SPRING_MAIL_HOST, SPRING_MAIL_PORT,
  # SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD). Without SPRING_MAIL_HOST sign-up mail is logged, not sent.
  mail:
    from: ${MAIL_FROM:no-reply@bjjeire.com}
  # FR-019: a place is held for 30 minutes while the competitor pays, Stripe Checkout's shortest expiry.
  registration:
    hold: ${REGISTRATION_HOLD:PT30M}
    hold-sweep-initial-delay: ${REGISTRATION_HOLD_SWEEP_INITIAL_DELAY:PT1M}
    hold-sweep-interval: ${REGISTRATION_HOLD_SWEEP_INTERVAL:PT1M}
  # ADR-0014: organiser sign-in without Entra, for local development only. The API refuses to start with
  # this on unless the 'local' profile is active. docker-compose.override.java-local.yml turns it on.
  local-sign-in:
    enabled: ${LOCAL_SIGN_IN_ENABLED:false}
    secret: ${LOCAL_SIGN_IN_SECRET:}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:https://bjjeire.com}
  donation:
    bitcoin-address: ${DONATION_BITCOIN_ADDRESS:${Donation__BitcoinAddress:REPLACE_WITH_OFFICIAL_ADDRESS}}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:${RateLimitOptions__EnableRateLimiting:true}}
    permit-limit: ${RATE_LIMIT_PERMIT_LIMIT:${RateLimitOptions__PermitLimit:600}}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:${RateLimitOptions__WindowInSeconds:60}}
    rejection-status-code: ${RATE_LIMIT_REJECTION_STATUS_CODE:${RateLimitOptions__RejectionStatusCode:429}}
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
  read-only-mode:
    enabled: ${READ_ONLY_MODE_ENABLED:${ReadOnlyMode__Enabled:true}}
  feature-flags:
    BjjEvents: ${FEATURE_BJJ_EVENTS:true}
    Gyms: ${FEATURE_GYMS:true}
    Competitions: ${FEATURE_COMPETITIONS:true}
    Stores: ${FEATURE_STORES:true}
    BjjEireCompetitions: ${FEATURE_BJJEIRE_COMPETITIONS:false}
    GymsMap: ${FEATURE_GYMS_MAP:false}
    EventsMap: ${FEATURE_EVENTS_MAP:false}
