otel:
  sdk:
    disabled: true

# Same exposure as src/main/resources/application.yml, which this file replaces on the test classpath, so /metrics
# (OperationalEndpointController) has the Prometheus scrape endpoint behind it.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

spring:
  mongodb:
    database: BjjEireTest
  # Same as src/main/resources/application.yml (ADR-0017): a completed publication is deleted.
  modulith:
    events:
      completion-mode: delete
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/test/v2.0

bjjeire:
  metrics:
    # Any free port: tests read the bound port from MetricsPortConfig.MetricsConnector.
    port: 0
  read-only-mode:
    enabled: false
  rate-limit:
    enabled: false
  # This file replaces src/main/resources/application.yml on the test classpath, so the competitor
  # tenant has to be named here too. MongoIntegrationTest.COMPETITOR_ISSUER must match.
  competitor-auth:
    issuer-uri: https://00000000-0000-0000-0000-000000000000.ciamlogin.com/00000000-0000-0000-0000-000000000000/v2.0
    audiences:
      - api://00000000-0000-0000-0000-000000000000
    scope: access_as_competitor
  # On so the competition routes exist for every IT. The off state is covered by
  # BjjEireCompetitionFeatureOffIT (its own context) and BjjEireCompetitionFeatureGateFilterTest.
  feature-flags:
    BjjEireCompetitions: true
    # On so the merch routes exist for every IT (ADR-0016). The off state is covered by MerchFeatureOffIT,
    # which shares BjjEireCompetitionFeatureOffIT's context, and MerchFeatureGateFilterTest.
    Merch: true
  # Sign-up (slice 3). RegistrationIntegrationTest.WEBHOOK_SECRET must match. Stripe and mail are recording
  # fakes in MongoIntegrationTest; the hold sweep is called directly, never on a timer.
  stripe:
    # Any non-placeholder value counts as configured. Short, so it never matches gitleaks' Stripe-key rule.
    secret-key: sk_test_fake
    webhook-secret: whsec_integration_test_secret
    # The shop's own endpoint (ADR-0016). OrderIntegrationTest.SHOP_WEBHOOK_SECRET must match.
    shop-webhook-secret: whsec_shop_integration_test_secret
    success-url-base: http://localhost:5173
  registration:
    hold-sweep-initial-delay: PT24H
  order:
    hold-sweep-initial-delay: PT24H
  # The event publication sweep is called directly, never on a timer (EventPublicationSweep).
  events:
    resubmit-initial-delay: PT24H
